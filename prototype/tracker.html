<title>Smarty</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap">
<style>
  :root {
    --ground: #f6f1e8;
    --paper: #fffdf9;
    --card: #ffffff;
    --ink: #3a332b;
    --dim: #7a7064;
    --faint: #ab9f8e;
    --accent: #6e9075;
    --accent-deep: #56745c;
    --accent-tint: #e8efe6;
    --overdue: #c1613f;
    --overdue-tint: #f7e7e0;
    --approaching: #c98a35;
    --approaching-tint: #f7ecd9;
    --pending: #8c8471;
    --pending-tint: #efeade;
    --done: #6e9075;
    --done-tint: #e8efe6;
    --pri-high: #c1613f;
    --pri-med: #b98a2e;
    --pri-low: #8c8471;
    --assistant: #8878b0;
    --assistant-deep: #6d5f94;
    --rule: #eee6d8;
    --rule-hard: #e6dbc7;
    --edge: #ddd0b8;
    --shadow: 0 2px 4px rgba(90, 74, 50, 0.05), 0 8px 20px rgba(90, 74, 50, 0.07);
    --shadow-sm: 0 1px 2px rgba(90, 74, 50, 0.06), 0 2px 8px rgba(90, 74, 50, 0.05);
    --display: 'Quicksand', 'Nunito', system-ui, sans-serif;
    --sans: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: #ece3d2; color: var(--ink); font-family: var(--sans); font-size: 14.5px; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, textarea { font: inherit; color: inherit; }

  #phone { height: 100%; max-width: 430px; margin: 0 auto; background: var(--ground); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #root { display: contents; }
  @media (min-width: 460px) { body { padding-block: 20px; } #phone { height: min(100%, 880px); border: 1px solid var(--edge); border-radius: 18px; } }

  .head { flex: none; padding: 22px 20px 0; background: var(--ground); }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 16px; }
  .wordmark { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 20px; background: var(--ground); }
  .scroll.pad-bottom { padding-bottom: 96px; }
  .paper-scroll { background: var(--paper); }

  .label { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--faint); text-transform: uppercase; }
  .sec { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 0 9px; }
  .display { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  .lede { font-size: 14px; line-height: 1.6; color: var(--dim); }

  .btn { display: block; width: 100%; text-align: center; padding: 15px 20px; font-size: 14.5px; font-weight: 700; border-radius: 16px; }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-primary:active { background: var(--accent-deep); }
  .btn-outline { border: 1.5px solid var(--edge); background: var(--paper); }
  .btn-quiet { color: var(--accent); font-size: 13.5px; padding: 11px 20px; font-weight: 700; }
  .btn-danger { color: var(--overdue); }
  .btn[disabled] { color: var(--faint); background: var(--paper); border: 1.5px solid var(--edge); cursor: default; box-shadow: none; }
  .foot { flex: none; padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; background: var(--paper); border-top: 1px solid var(--rule-hard); }

  /* Task rows — soft circular checkbox, title, meta line, colored due text */
  .task { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); width: 100%; }
  .task:active { background: rgba(110,144,117,0.06); }
  .checkbox { flex: none; width: 21px; height: 21px; border-radius: 50%; border: 1.8px solid var(--edge); background: var(--paper); display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .checkbox[aria-checked="true"] { background: var(--done); border-color: var(--done); }
  .flag { flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .task-title.done { text-decoration: line-through; color: var(--faint); font-weight: 500; }
  .task-meta { display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 11.5px; color: var(--faint); }
  .task-meta .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .due-chip { flex: none; font-size: 11.5px; font-weight: 700; padding-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .due-chip.overdue { color: var(--overdue); }
  .due-chip.approaching { color: var(--approaching); }
  .due-chip.pending { color: var(--faint); }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 10px 4px 8px; border-radius: 20px; }
  .pill.overdue { background: var(--overdue-tint); color: var(--overdue); }
  .pill.approaching { background: var(--approaching-tint); color: var(--approaching); }
  .pill.pending { background: var(--pending-tint); color: var(--pending); }
  .pill.done { background: var(--done-tint); color: var(--done); }

  /* Segment cards — big, rounded, soft-shadowed boxes, per the client's own direction */
  .segcard { display: block; width: 100%; background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 18px 19px; margin-top: 14px; }
  .segcard:first-child { margin-top: 4px; }
  .segcard:active { box-shadow: var(--shadow-sm); }
  .segcard-head { display: flex; align-items: flex-start; gap: 12px; }
  .segcard-icon { flex: none; width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .segcard-name { font-family: var(--display); font-size: 16.5px; font-weight: 700; }
  .segcard-desc { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin-top: 3px; }
  .segcard-badge { flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; }
  .segcard-counts { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .segcard-count { font-size: 12px; font-weight: 700; }
  .segcard-count .n { font-variant-numeric: tabular-nums; }
  .segcard-calm { font-size: 12.5px; color: var(--done); font-weight: 700; margin-top: 14px; }
  .segcard-tasks { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .segcard-task { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .segcard-task-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .segcard-task-title.done { text-decoration: line-through; color: var(--faint); font-weight: 500; }
  .segcard-task-pri { flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
  .segcard-more { font-size: 11.5px; color: var(--faint); font-weight: 600; }
  .segcard-empty { font-size: 12.5px; color: var(--faint); font-style: italic; }

  /* The dashboard as a canvas — segments as small colored tiles in a grid,
     not one long column. Each tile carries its own segment color, and
     priority reads as a color, not a label. */
  .canvas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 6px; }
  .seg-tile { position: relative; display: flex; flex-direction: column; text-align: left; border-radius: 20px; padding: 14px 14px 15px; box-shadow: var(--shadow-sm); min-height: 150px; }
  .seg-tile:active { box-shadow: none; transform: translateY(1px); }
  .seg-tile-icon { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
  .seg-tile-name { font-family: var(--display); font-size: 14.5px; font-weight: 700; margin-top: 9px; line-height: 1.25; }
  .seg-tile-badge { display: inline-block; margin-top: 3px; font-size: 8.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; background: rgba(255,255,255,0.55); }
  .seg-tile-alert { position: absolute; top: 12px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--overdue); box-shadow: 0 0 0 2px rgba(255,255,255,0.7); }
  .seg-tile-tasks { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .seg-tile-task { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .seg-tile-task-title { font-size: 11.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg-tile-empty { font-size: 11px; color: var(--dim); font-style: italic; margin-top: 10px; }
  .seg-tile-more { font-size: 10.5px; color: var(--dim); font-weight: 700; margin-top: 1px; }
  .pri-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .seg-tile-add { align-items: center; justify-content: center; gap: 6px; background: transparent; border: 1.5px dashed var(--edge); box-shadow: none; color: var(--accent); font-size: 12.5px; font-weight: 700; }
  .seg-tile-add:active { background: var(--paper); }

  /* Simple rows — used in sheets and onboarding lists, not the dashboard's own cards */
  .segrow { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); width: 100%; }
  .segrow:active { background: rgba(110,144,117,0.06); }
  .segdot { flex: none; width: 11px; height: 11px; border-radius: 50%; }
  .seg-counts { display: flex; gap: 12px; margin-top: 4px; }
  .seg-count { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .chiprow { display: flex; gap: 7px; overflow-x: auto; padding: 4px 20px 14px; flex: none; scrollbar-width: none; background: var(--ground); }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1.5px solid var(--edge); background: var(--paper); padding: 7px 13px; font-size: 12.5px; font-weight: 700; color: var(--dim); border-radius: 20px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .stats { display: flex; gap: 0; margin-top: 2px; }
  .tile { flex: 1; padding: 12px 4px 12px 0; }
  .tile .n { font-family: var(--display); font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .tile .label { margin-top: 5px; }

  /* Calendar tab — a month grid, each day showing a colored dot per open
     task due that day (same priority palette as everywhere else), so the
     whole month's load reads at a glance before drilling into one day. */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 12px; }
  .cal-nav button { padding: 6px; }
  .cal-nav .month-label { font-family: var(--display); font-size: 16px; font-weight: 700; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { text-align: center; font-size: 10px; font-weight: 700; color: var(--faint); letter-spacing: 0.03em; padding-bottom: 6px; }
  .cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; background: transparent; border: 1.5px solid transparent; }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell .daynum { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cal-cell.is-today .daynum { color: var(--accent); }
  .cal-cell.is-today { border-color: var(--accent); }
  .cal-cell[aria-pressed="true"] { background: var(--ink); }
  .cal-cell[aria-pressed="true"] .daynum { color: #fff; }
  .cal-dots { display: flex; align-items: center; gap: 2px; height: 5px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; flex: none; }
  .cal-more { font-size: 8px; font-weight: 800; color: var(--dim); }
  .cal-cell[aria-pressed="true"] .cal-more { color: #fff; opacity: 0.8; }

  .check-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--rule); width: 100%; }
  .check { flex: none; width: 19px; height: 19px; border-radius: 6px; border: 1.8px solid var(--edge); background: var(--paper); display: flex; align-items: center; justify-content: center; }
  .check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .toggle { flex: none; width: 40px; height: 23px; border-radius: 20px; border: 1px solid var(--edge); background: var(--paper); position: relative; }
  .toggle i { position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #d8cdb9; }
  .toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .toggle[aria-checked="true"] i { left: auto; right: 2px; background: #fff; }
  .field { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--rule); width: 100%; }
  .field-k { flex: none; width: 96px; font-size: 12px; font-weight: 700; color: var(--faint); }
  .field-v { flex: 1; font-size: 14.5px; font-weight: 600; }
  .field-v.empty { color: var(--faint); font-weight: 400; }
  .quote { font-size: 16px; font-weight: 500; line-height: 1.55; padding-left: 12px; border-left: 3px solid var(--accent); }
  .empty-note { font-size: 13px; color: var(--faint); line-height: 1.6; padding: 16px 0; }

  .sheet-wrap { position: absolute; inset: 0; background: rgba(58,51,43,0.28); display: flex; align-items: flex-end; z-index: 20; }
  .sheet { width: 100%; background: var(--paper); max-height: 92%; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 28px rgba(58,51,43,0.16); }
  .toast { position: absolute; left: 20px; right: 20px; bottom: 96px; background: var(--ink); color: #fff; padding: 13px 16px; font-size: 13px; border-radius: 14px; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: var(--shadow); }
  .toast button { font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; color: #fff; text-transform: uppercase; }
  .rec-dot { width: 7px; height: 7px; background: var(--overdue); border-radius: 50%; }

  .type-in { width: 100%; border: none; background: transparent; font-size: 18px; font-weight: 500; line-height: 1.4; resize: none; outline: none; }
  .type-in::placeholder { color: var(--faint); }
  .note-in { width: 100%; border: 1.5px solid var(--edge); border-radius: 14px; background: var(--paper); padding: 12px 14px; font-size: 13.5px; line-height: 1.55; resize: none; outline: none; min-height: 68px; }
  .note-in:focus { border-color: var(--accent); }
  .text-in { width: 100%; border: none; border-bottom: 1.5px solid var(--edge); background: transparent; padding: 8px 0; font-size: 15px; outline: none; }
  .text-in:focus { border-color: var(--accent); }

  .stepper { display: flex; gap: 4px; margin-top: 4px; }
  .stepper i { flex: 1; height: 4px; border-radius: 3px; background: var(--rule-hard); }
  .stepper i.on { background: var(--accent); }

  .pillrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .opt { border: 1.5px solid var(--edge); border-radius: 20px; background: var(--paper); padding: 9px 15px; font-size: 13px; font-weight: 600; color: var(--dim); }
  .opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .opt.pri-high[aria-pressed="true"] { background: var(--overdue); border-color: var(--overdue); }

  .track { height: 7px; border-radius: 5px; background: var(--rule-hard); margin-top: 8px; overflow: hidden; display: flex; }
  .track i { display: block; height: 100%; }

  .example-frame { border: 1.5px solid var(--rule-hard); border-radius: 18px; padding: 4px 14px; margin-top: 16px; background: var(--paper); }
  .followup { background: var(--accent-tint); border-radius: 14px; padding: 13px 15px; margin-top: 12px; font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .followup .opts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .box { background: var(--accent-tint); border-radius: 16px; padding: 14px 16px; }
  .fab { position: absolute; right: 18px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 27px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(110,144,117,0.45); z-index: 10; }
  .fab:active { background: var(--accent-deep); }
  .fab-guide { position: absolute; right: 84px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 27px; background: var(--paper); border: 2px solid var(--edge); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(90,74,50,0.18); z-index: 10; }
  .fab-guide:active { background: var(--ground); }

  /* The guide screen — a lightweight chat with the assistant, one question
     at a time, rather than a form dumped on you all at once. */
  .guide-msg { display: flex; gap: 10px; margin-top: 16px; align-items: flex-start; }
  .guide-avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--edge); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .guide-bubble { background: var(--card); border-radius: 4px 16px 16px 16px; padding: 12px 15px; box-shadow: var(--shadow-sm); font-size: 14px; line-height: 1.5; max-width: 84%; }
  .guide-you { display: flex; justify-content: flex-end; margin-top: 12px; }
  .guide-you-bubble { background: var(--accent); color: #fff; border-radius: 16px 4px 16px 16px; padding: 10px 15px; font-size: 13.5px; max-width: 84%; }

  .nav { flex: none; background: var(--paper); border-top: 1px solid var(--rule-hard); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 4px 10px; }
  .nav .navlabel { font-size: 10px; font-weight: 700; color: var(--faint); }
  .nav button[aria-current="page"] .navlabel { color: var(--accent); }
  .avatar { width: 27px; height: 27px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none; }

  /* The turtle — a temporary project's own start-to-finish path */
  .turtle-wrap { margin-top: 16px; }
  .turtle-track { position: relative; height: 34px; margin-top: 6px; }
  .turtle-path { position: absolute; left: 15px; right: 15px; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 2px; background-image: linear-gradient(to right, var(--edge) 0 6px, transparent 6px 12px); background-size: 12px 3px; background-repeat: repeat-x; }
  .turtle-post { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; margin-top: -4.5px; background: var(--edge); }
  .turtle-post.start { left: 11px; }
  .turtle-post.finish { right: 11px; background: var(--accent); }
  .turtle-icon { position: absolute; top: 50%; transform: translate(-50%, -60%); width: 32px; line-height: 1; transition: left 0.5s cubic-bezier(.34,1.4,.64,1); filter: drop-shadow(0 1px 1px rgba(58,51,43,0.15)); }
  .turtle-icon svg { display: block; width: 100%; height: auto; }
  .mimi-turtle { display: block; }
  .mimi-turtle svg { display: block; width: 100%; height: auto; }
  .app-logo { display: block; width: 100%; height: auto; }
  .turtle-caption { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; color: var(--faint); letter-spacing: 0.03em; text-transform: uppercase; margin-top: 2px; gap: 6px; }
  .turtle-caption span:last-child { text-align: right; }
  .turtle-eta { font-size: 11.5px; color: var(--dim); margin-top: 2px; font-weight: 600; }
  .turtle-wrap.mini { margin-top: 8px; }
  .turtle-wrap.mini .turtle-track { height: 20px; margin-top: 2px; }
  .turtle-wrap.mini .turtle-path { left: 8px; right: 8px; }
  .turtle-wrap.mini .turtle-post { width: 6px; height: 6px; }
  .turtle-wrap.mini .turtle-post.start { left: 5px; }
  .turtle-wrap.mini .turtle-post.finish { right: 5px; }
  .turtle-wrap.mini .turtle-icon { width: 19px; }
  .turtle-wrap.mini .turtle-pct { font-size: 10.5px; font-weight: 700; color: var(--dim); margin-top: 1px; }
</style>
<div id="phone"><div id="root"></div></div>
<script>
(function () {
  'use strict';
  var TODAY = new Date();
  var DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MON_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var WORDS = ['no','one','two','three','four','five','six','seven','eight','nine'];

  function d0(y, m, day) { return new Date(y, m, day); }
  function startOfDay(dt) { return d0(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
  function daysFrom(iso) { if (!iso) return null; var dt = new Date(iso + 'T00:00:00'); return Math.round((startOfDay(dt) - startOfDay(TODAY)) / 86400000); }
  function monDate(dt) { return dt.getDate() + ' ' + MON[dt.getMonth()]; }

          '<div class="pillrow" style="margin-top:14px;padding-left:44px">' +
            '<button class="opt" style="background:var(--accent);border-color:var(--accent);color:#fff" data-act="guide-confirm-yes">Yes, add it</button>' +
            '<button class="opt" data-act="guide-adjust" data-v="priority">Priority</button>' +
            '<button class="opt" data-act="guide-adjust" data-v="reminder">Reminder</button>' +
          '</div>';
      }
      // What was most recently heard — the original phrase, or your latest
      // spoken reply, whichever is newer — stays visible right above
      // Mimi's current question. That's the one place to actually catch a
      // mis-transcription before it's acted on, rather than finding out
      // three questions later that something got misheard.
      body =
        '<div class="guide-you"><div class="guide-you-bubble">“' + esc(g.lastHeard || g.heard) + '”</div></div>' +
        body +
        '<div class="label" style="margin-top:18px;padding-left:44px;color:' + micStatusColor() + '">' + micStatusLabel('OR SAY YOUR ANSWER') + '</div>' +
        '<textarea class="type-in" id="guide-in" rows="2" placeholder="e.g. personal, or yes that looks right" style="margin-top:8px">' + esc(S.draft || '') + '</textarea>';
    } else if (g.step === 'answer') {
      // Mimi can also just answer a question about your tasks instead of
      // adding one — same mic/text input, routed by isQuestion() rather
      // than a separate mode you have to pick.
      var ans = g.answerData || { lead: '', ids: [] };
      body =
        '<div class="guide-you"><div class="guide-you-bubble">“' + esc(g.heard) + '”</div></div>' +
        '<div class="guide-msg"><div class="guide-avatar">' + mimiTurtle(24) + '</div>' +
          '<div class="guide-bubble">' + esc(ans.lead) + '</div>' +
        '</div>' +
        (ans.ids && ans.ids.length ? '<div style="padding-left:44px;margin-top:8px">' + ans.ids.map(function (id) { var t = taskById(id); return t ? taskRow(t) : ''; }).join('') + '</div>' : '');
    } else if (g.step === 'done') {
      body =
        '<div class="guide-msg"><div class="guide-avatar">' + mimiTurtle(24) + '</div>' +
          '<div class="guide-bubble">Added “' + esc(g.createdTitle) + '” to <b>' + esc(g.createdSegment) + '</b>, ' + priorityWord(g.priority).toLowerCase() + ' priority' + (g.date ? ', ' + dueChip(g.date).text.toLowerCase() + (g.time ? ' at ' + timeLabel(g.time) : '') : '') + (g.reminder && g.reminder.mode !== 'none' ? ', reminder ' + reminderLabel(g.reminder).toLowerCase() : '') + '. Anything else' + greetName() + '?' +
            (g.createdCalendarUrl ? '<br><a href="' + esc(g.createdCalendarUrl) + '" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;display:inline-block;margin-top:8px">Add to Google Calendar →</a>' : '') +
          '</div>' +
        '</div>';
    } else if (g.step === 'segment-created') {
      // "Make a new segment called X" is a different kind of request than
      // adding a task — recognized up front in guide-submit, before the
      // task parser ever sees it, rather than force-fitting it through
      // task-parsing and producing nonsense.
      body =
        '<div class="guide-you"><div class="guide-you-bubble">“' + esc(g.heard) + '”</div></div>' +
        '<div class="guide-msg"><div class="guide-avatar">' + mimiTurtle(24) + '</div>' +
          '<div class="guide-bubble">Created a new segment: <b>' + esc(g.createdSegmentName) + '</b>. Want to add a task to it now, or anything else' + greetName() + '?</div>' +
        '</div>';
    }

    return backHeader('Mimi', 'go', 'dashboard') +
      '<div class="scroll pad-bottom">' + body + '</div>' +
      '<div class="foot">' +
        (g.step === 'listen' ? '<div style="display:flex;gap:10px">' +
          '<button class="btn btn-outline" data-act="mic"' + (S.transcribing ? ' disabled' : '') + ' style="flex:none;width:50px;display:flex;align-items:center;justify-content:center;padding:0">' + svg(IC.mic, 18, micButtonColor()) + '</button>' +
          '<button class="btn btn-primary" data-act="guide-submit" style="flex:1">Send</button>' +
        '</div>' : '') +
        (g.step === 'confirm' ? '<div style="display:flex;gap:10px">' +
          '<button class="btn btn-outline" data-act="mic"' + (S.transcribing ? ' disabled' : '') + ' style="flex:none;width:50px;display:flex;align-items:center;justify-content:center;padding:0">' + svg(IC.mic, 18, micButtonColor()) + '</button>' +
          '<button class="btn btn-primary" data-act="guide-voice-answer" style="flex:1">Send</button>' +
        '</div>' : '') +
        ((g.step === 'done' || g.step === 'segment-created') ? '<div style="display:flex;gap:10px">' +
          '<button class="btn btn-outline" data-act="guide-again" style="flex:1">Add another</button>' +
          '<button class="btn btn-primary" data-act="go" data-v="dashboard" style="flex:1">Done</button>' +
        '</div>' : '') +
        (g.step === 'answer' ? '<div style="display:flex;gap:10px">' +
          '<button class="btn btn-outline" data-act="guide-again" style="flex:1">Ask or add another</button>' +
          '<button class="btn btn-primary" data-act="go" data-v="dashboard" style="flex:1">Done</button>' +
        '</div>' : '') +
      '</div>' + toastHtml();
  };

  SCREENS['add-task'] = function () {
    if (S.captureFlow === 'listen') return captureListenScreen();
    if (S.captureFlow === 'proposals') return proposalsScreen();
    if (S.captureFlow === 'answer') return answerScreen();

  };

  function manualTaskScreen() {

      '<div class="scroll pad-bottom">' +
        '<button class="capture-open" data-act="start-capture" style="display:flex;align-items:center;gap:10px;border:1px solid var(--edge);border-radius:8px;padding:11px 14px;margin:2px 0 8px;width:100%;background:var(--paper)">' +
          svg(IC.mic, 15, 'var(--accent)') + '<span style="color:var(--faint);font-size:13px">Or just say what you need</span></button>' +
        '<input class="text-in" id="task-title-in" placeholder="Task title" value="' + esc(d.title) + '" style="font-size:17px;font-weight:600;margin-top:8px">' +
        '<div class="field"><div class="field-k">SEGMENT</div>' +
          '<button class="field-v' + (!seg ? ' empty' : '') + '" data-act="open-sheet" data-v="pick-segment">' + (seg ? (dot(seg.color, 9) + ' ' + esc(seg.name)) : 'Choose a segment') + '</button></div>' +
        '<div class="field"><div class="field-k">DEADLINE</div>' +
          '<button class="field-v' + (!d.due_at && !d.noDeadlineChosen ? ' empty' : '') + '" data-act="open-sheet" data-v="pick-date">' +
            (d.due_at ? longDate(new Date(d.due_at + 'T00:00:00')) + (d.due_time ? ' · ' + timeLabel(d.due_time) : '') : (d.noDeadlineChosen ? 'No deadline' : 'Choose…')) + '</button></div>' +
        '<div class="field"><div class="field-k">PRIORITY</div>' +
          '<div class="pillrow">' + ['low', 'normal', 'high'].map(function (pr) {
            return '<button class="opt' + (pr === 'high' ? ' pri-high' : '') + '" aria-pressed="' + (d.priority === pr) + '" data-act="set-draft" data-k="priority" data-v="' + pr + '">' + titleCase(pr) + '</button>';
          }).join('') + '</div></div>' +
        '<div class="field"><div class="field-k">REMINDER</div>' +

        '<div class="sec">NOTES</div>' +
        '<textarea class="note-in" id="task-notes-in" placeholder="Context, a link, source, or completion details…" style="margin-top:6px">' + esc(d.notes) + '</textarea>' +
        // A dated task is offered to your calendar automatically right when
        // it's saved (see save-task's toast) — these links stay here too,
        // any time you want to (re)add it, with no separate toggle or
        // "connect a calendar" step needed: they're stateless, one-tap

        (d.due_at ? (

            '<a href="' + esc(taskCalendarUrl(d, seg)) + '" target="_blank" rel="noopener" class="task-title" style="color:var(--accent);flex:1">Add to Google Calendar →</a>' +
          '</div>' +
          (API && d.id ? (
            '<div class="segrow" style="cursor:default;padding-left:0">' +
              '<a href="' + API + '/api/tasks/' + d.id + '/calendar.ics" class="task-title" style="color:var(--accent);flex:1">Download for Apple Calendar (.ics)</a>' +
            '</div>'
          ) : '')
        ) : '') +
      '</div>' +
      '<div class="foot">' +
        (d.id ? '<button class="btn btn-outline btn-danger" data-act="delete-task" data-v="' + d.id + '">Delete task</button>' : '') +
        '<button class="btn btn-primary" data-act="save-task">' + (d.id ? 'Save changes' : 'Add task') + '</button>' +
      '</div>' +
      sheetOverlay() + toastHtml();
  }

  function captureListenScreen() {
    return backHeader('Quick add', 'go', S.tabBefore || 'dashboard') +
      '<div class="scroll pad-bottom" style="display:flex;flex-direction:column;height:100%">' +
        '<div class="label" style="margin-top:16px;color:' + micStatusColor() + '">' + micStatusLabel('TYPE, OR TAP THE MIC') + '</div>' +
        '<textarea class="type-in" id="capture-in" rows="5" placeholder="e.g. Pay the electricity bill by Friday and remind me the day before" style="margin-top:10px;flex:none">' + esc(S.draft || '') + '</textarea>' +

        '<div style="flex:1"></div>' +
      '</div>' +
      '<div class="foot" style="flex-direction:row;gap:10px">' +
        '<button class="btn btn-outline" data-act="mic"' + (S.transcribing ? ' disabled' : '') + ' style="flex:none;width:50px;display:flex;align-items:center;justify-content:center;padding:0">' + svg(IC.mic, 18, micButtonColor()) + '</button>' +

  function proposalsScreen() {

      '<div class="scroll pad-bottom">' +
        '<div class="label" style="margin-top:16px">YOU SAID</div>' +
        '<p class="quote" style="margin:8px 0 0">“' + esc(S.heard) + '”</p>' +

        list.map(function (pr, i) {
          var seg = pr.segmentId ? segmentById(pr.segmentId) : null;
          var chip = pr.date ? dueChip(pr.date) : null;

              '<div class="label" style="color:var(--accent)">NEW TASK</div>' +
              '<button data-act="discard-proposal" data-v="' + i + '" class="label" style="color:var(--overdue)">REMOVE</button>' +
            '</div>' +
            '<div class="task-title" style="margin-top:6px;font-size:15px">' + esc(pr.title) + '</div>' +
            '<div class="task-meta" style="margin-top:6px">' +
              (seg ? (dot(seg.color, 7) + '<span>' + esc(seg.name) + '</span>') : '<span style="color:var(--accent)">Choose a segment →</span>') +
              (chip ? '<span>· ' + chip.text + (pr.time ? ' · ' + timeLabel(pr.time) : '') + '</span>' : '<span>· No deadline</span>') +
              (pr.priority === 'high' ? '<span>· High priority</span>' : '') +

            (pr.needsSegmentChoice ? '<div class="pillrow" style="margin-top:8px">' + activeSegments().map(function (sg) {

            }).join('') + '</div>' : '') +
            (pr.followUp ? '<div class="followup">' + esc(pr.followUp) +
              '<div class="opts"><button class="opt" data-act="proposal-confirm-date" data-i="' + i + '" data-v="near">Yes, that one</button>' +
              (pr.alt ? '<button class="opt" data-act="proposal-confirm-date" data-i="' + i + '" data-v="alt">The one after</button>' : '') + '</div></div>' : '') +
            '<button data-act="open-sheet" data-v="pick-proposal-reminder" data-sv="' + i + '" class="task-meta" style="margin-top:8px;color:var(--accent)">Reminder: ' + reminderLabel(pr.reminder) + (pr.reminder && pr.reminder.needsConfirm ? ' — confirm this is right' : '') + '</button>' +

      '<div class="foot">' +
        '<button class="btn btn-primary" data-act="accept-all-proposals"' + (!list.length || list.some(function (pr) { return !pr.followUp && !pr.segmentId; }) ? ' disabled' : '') + '>Save ' + count(list.length, 'task', 'tasks') + '</button>' +
      '</div>' +
      sheetOverlay() + toastHtml();
  }

  function answerScreen() {

    return backHeader('Ask the tracker', 'cancel-add-task') +
      '<div class="scroll pad-bottom">' +
        '<div class="label" style="margin-top:16px">YOU ASKED</div>' +
        '<p class="quote" style="margin:8px 0 0">“' + esc(S.heard) + '”</p>' +

          '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:10px 0 4px">' +
            '<p style="font-size:16px;font-weight:500;line-height:1.5;flex:1">' + esc(a.lead) + '</p>' +

          '</div>' +

      '<div class="scroll pad-bottom" style="margin-top:6px">' +

          return '<button class="segrow" data-act="set-draft-segment" data-v="' + s.id + '">' + dot(s.color) + '<span class="task-title">' + esc(s.name) + '</span></button>';
        }).join('') +
        '<button class="segrow" data-act="new-segment-from-task" style="color:var(--accent)">' + svg(IC.plus, 15, 'var(--accent)') + '<span class="task-title" style="color:var(--accent)">New segment…</span></button>' +
      '</div>';
  };
  SHEETS['pick-date'] = function () {
    var d = S.draft;
    var opts = [['Today', isoOf(TODAY)], ['Tomorrow', isoOf(new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() + 1))], ['In a week', isoOf(new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() + 7))]];

      '<div class="scroll pad-bottom" style="margin-top:6px">' +
        opts.map(function (o) { return '<button class="segrow" data-act="set-draft-date" data-v="' + o[1] + '"><span class="task-title" style="flex:1">' + o[0] + '</span><span class="due-chip pending">' + dueChip(o[1]).text + '</span></button>'; }).join('') +
        '<div class="segrow"><span class="task-title" style="flex:1">Pick a date</span><input type="date" id="exact-date-in" class="text-in" style="width:150px;border-bottom:none" value="' + (d.due_at || '') + '"></div>' +
        '<div class="segrow"><span class="task-title" style="flex:1">Time <span class="task-meta" style="text-transform:none;letter-spacing:0">(optional)</span></span><input type="time" id="exact-time-in" class="text-in" style="width:110px;border-bottom:none" value="' + (d.due_time || '') + '"></div>' +

      '</div>';

  SHEETS['global-reminder'] = function () {

  SHEETS['export-data'] = function () {

  function toastHtml() {

    return '<div class="toast"><span>' + esc(t.msg) + '</span>' +
      (t.calendarUrl ? '<a href="' + esc(t.calendarUrl) + '" target="_blank" rel="noopener" style="color:#fff;font-weight:800;font-size:11px;letter-spacing:0.03em;text-transform:uppercase;flex:none;white-space:nowrap">ADD TO CALENDAR</a>' : '') +
      '<button data-act="dismiss-toast">DISMISS</button></div>';

  function tile(n, label, color) {

  // ---------------------------------------------------------------- local parser (fallback mode)
  // Mirrors backend/assistant.js so the demo behaves identically with or
  // without a server behind it.
  var WD = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  var REMINDER_PHRASE = /\bremind me\b|\breminder\b/i;
  var HIGH_PRIORITY = /\burgent\b|\basap\b|\bimmediately\b|\bcritical\b|\bhigh priority\b/i;
  var LOW_PRIORITY = /\bwhenever\b|\bno rush\b|\blow priority\b/i;

  function localResolveDate(t, today) {
    var add = function (n) { var x = new Date(today); x.setDate(x.getDate() + n); return x; };
    var m;
    if (/\btomorrow\b/.test(t)) return { date: add(1) };
    if (/\btoday\b|\btonight\b/.test(t)) return { date: add(0) };
    if ((m = t.match(/\bin (\d+) days?\b/))) return { date: add(parseInt(m[1], 10)) };
    if ((m = t.match(/\bnext (sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))) {
      var delta1 = (WD.indexOf(m[1]) - today.getDay() + 7) % 7; if (delta1 === 0) delta1 = 7; delta1 += 7;
      return { date: add(delta1) };
    }
    // "every <weekday>" names a recurring slot, not an ambiguous one-off — the
    // data model has no recurrence field, so this becomes its next upcoming
    // occurrence rather than the "which one did you mean" follow-up a bare
    // weekday gets below.
    if ((m = t.match(/\bevery (sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))) {
      var deltaE = (WD.indexOf(m[1]) - today.getDay() + 7) % 7; if (deltaE === 0) deltaE = 7;
      return { date: add(deltaE) };
    }
    // A bare weekday ("Friday") means the nearest upcoming one — today
    // itself if today is that day — resolved outright, with no "which one
    // did you mean" follow-up; say "next Friday" (above) to skip to the
    // week after.
    if ((m = t.match(/\b(?:on |by )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))) {
      var delta2 = (WD.indexOf(m[1]) - today.getDay() + 7) % 7;
      return { date: add(delta2) };
    }
    if ((m = t.match(/\b(?:on |by |the )(\d{1,2})(?:st|nd|rd|th)\b/))) {
      var day = parseInt(m[1], 10);
      var x = new Date(today.getFullYear(), today.getMonth(), day);
      if (x < today) x = new Date(today.getFullYear(), today.getMonth() + 1, day);
      return { date: x };
    }
    if (/\bnext week\b/.test(t)) return { date: add(7), ambiguous: true, question: 'Which day next week?' };
    if (/\bend of the month\b|\bthis month\b/.test(t)) return { date: new Date(today.getFullYear(), today.getMonth() + 1, 0), ambiguous: true, question: 'Which day this month?' };
    return {};
  }
  // A time-of-day phrase — "at 5pm", "at 5:30 pm" — becomes an "HH:MM" the
  // same way whether it came from typing or the mic, since both land in the
  // same text before this ever runs. Only resolves when am/pm (or an
  // explicit minute) makes the hour unambiguous — "at 5" alone could be
  // either 5am or 5pm, and guessing wrong is worse than leaving it unset.
  function localResolveTime(t) {
    var m = t.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i) || t.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/i);
    if (!m) return null;
    var h = parseInt(m[1], 10), min = m[2] ? parseInt(m[2], 10) : 0, ap = m[3] ? m[3].toLowerCase() : null;
    if (isNaN(h) || h > 23 || min > 59) return null;
    if (ap === 'pm' && h < 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
  }
  // Mirrors backend/assistant.js's reminderFrom() — pulls a specific
  // timing out of the phrase ("remind me 30 minutes before") instead of
  // always falling back to the generic day-before default.
  function localReminderFrom(clause) {
    var t = clause.toLowerCase();
    if (!REMINDER_PHRASE.test(t)) return null;
    if (/\b15\b[^.]{0,12}\bmin|fifteen minutes?\b/.test(t)) return { mode: 'before_minutes', offsetMinutes: 15 };
    if (/\b30\b[^.]{0,12}\bmin|thirty minutes?\b|half an? hour\b/.test(t)) return { mode: 'before_minutes', offsetMinutes: 30 };
    if (/\b(?:60|one|1)\s*(?:min(?:ute)?s?\b|hour)|an hour before\b/.test(t)) return { mode: 'before_minutes', offsetMinutes: 60 };
    if (/at the deadline\b|when it'?s due\b|right (?:at|when)\b/.test(t)) return { mode: 'at_deadline' };
    if (/every week\b|weekly\b|each week\b/.test(t)) return { mode: 'repeat', repeatRule: 'weekly' };
    if (/day before\b|24 hours?\b/.test(t)) return { mode: 'before', offsetDays: 1, atHour: 9 };
    return { mode: 'before', offsetDays: 1, atHour: 9, needsConfirm: true };
  }
  function localSplitClauses(text) {
    var parts = String(text).split(/\s+and (?:then )?(?=\w)|[;.]\s+|,\s+(?:and\s+)?(?:also|then)\s+/i).map(function (c) { return c.trim(); }).filter(function (c) { return c.length > 2; });
    var merged = [];
    parts.forEach(function (c) {
      if (/^remind me\b/i.test(c) && merged.length) merged[merged.length - 1] += ' and ' + c;
      else merged.push(c);
    });
    return (merged.length ? merged : [String(text)]).slice(0, 4);
  }
  function localCleanTitle(raw) {
    return raw.trim()
      .replace(/^(i need to|i have to|i must|i should|please|can you|remind me to|remember to|don'?t forget to|i want to)\s+/i, '')
      .replace(/^for (?:my |our |the )?[^,]{1,40},\s*/i, '')
      .replace(/,?\s*(?:and\s+)?remind me\b.*/i, '')
      .replace(/\b(?:on |by |every )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/gi, '')
      .replace(/\b(tomorrow|today|tonight|next week|this month|end of the month)\b/gi, '')
      .replace(/\bin \d+ days?\b/gi, '')
      .replace(/\b(?:on |by |before )?the \d{1,2}(?:st|nd|rd|th)\b/gi, '')
      .replace(/\b(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi, '')
      .replace(/\b\d{1,2}:\d{2}\s*(?:am|pm)?\b/gi, '')
      .replace(/,?\s*\b(?:urgent|asap|immediately|critical|whenever|no rush|low priority|high priority)\b\.?/gi, '')
      .replace(/\s{2,}/g, ' ').replace(/\s+([,.])/g, '$1').replace(/[,\s]+$/, '').trim();
  }
  function localMatchSegment(clause) {
    var t = clause.toLowerCase(), best = null, bestScore = 0;
    activeSegments().forEach(function (s) {
      var words = s.name.toLowerCase().split(/\W+/).filter(function (w) { return w.length > 3; });
      var score = words.filter(function (w) { return t.indexOf(w) > -1; }).length;
      if (score > bestScore) { bestScore = score; best = s; }
    });
    return bestScore > 0 ? best : null;
  }
  function localParseClause(raw, i) {
    var today = TODAY;
    var t = raw.toLowerCase();
    var when = localResolveDate(t, today);
    var time = localResolveTime(t);
    var seg = localMatchSegment(raw);
    var title = titleCase(localCleanTitle(raw)) || titleCase(raw.trim());
    var priority = 'normal';
    if (HIGH_PRIORITY.test(t)) priority = 'high'; else if (LOW_PRIORITY.test(t)) priority = 'low';
    return {
      id: 'p' + (i + 1), title: title, segmentId: seg ? seg.id : null, segmentName: seg ? seg.name : null,
      needsSegmentChoice: !seg, date: when.date ? isoOf(when.date) : null, dateAmbiguous: !!when.ambiguous,
      followUp: when.question || null, alt: when.alt ? isoOf(when.alt) : null, time: time,

  // The onboarding "add first tasks" screen invites a plain list — "pay the
  // bill, book the dentist" — so it splits on bare commas too, not just the
  // clause-boundary punctuation a full sentence needs elsewhere.
  function localParseTaskList(text) {
    var parts = String(text).split(/\s*,\s*|\s+and\s+/i).map(function (c) { return c.trim(); }).filter(function (c) { return c.length > 2; });
    return (parts.length ? parts : [String(text)]).slice(0, 6).map(localParseClause);
  }
  function localAnswer(text) {
    var t = text.toLowerCase(), now = TODAY;
    var open = S.tasks.filter(function (tk) { return tk.status === 'open'; });
    var segName = function (id) { var s = segmentById(id); return s ? s.name : ''; };

    if (/how much did i complete|completed this week|what did i complete/.test(t)) {
      var done = S.tasks.filter(function (tk) { return tk.status === 'completed' && tk.completed_at && daysFrom(tk.completed_at.slice(0, 10)) >= -7; });
      return { title: 'COMPLETED THIS WEEK', lead: done.length ? titleCase(count(done.length, 'task', 'tasks')) + ' completed this week.' : 'Nothing completed yet this week.', ids: done.map(function (tk) { return tk.id; }) };
    }
    if (/what is overdue|what'?s overdue|overdue\b/.test(t)) {
      var late = open.filter(function (tk) { return taskState(tk) === 'overdue'; });
      return { title: 'OVERDUE', lead: late.length ? titleCase(count(late.length, 'task is', 'tasks are')) + ' overdue.' : 'Nothing is overdue.', ids: late.map(function (tk) { return tk.id; }) };
    }
    if (/due today|today'?s tasks|what'?s due today|due by today/.test(t)) {
      var dueToday = open.filter(function (tk) { return tk.due_at && daysFrom(tk.due_at) === 0; });
      return { title: 'DUE TODAY', lead: dueToday.length ? titleCase(count(dueToday.length, 'task is', 'tasks are')) + ' due today.' : 'Nothing is due today.', ids: dueToday.map(function (tk) { return tk.id; }) };
    }
    if (/due this week|this week|next few days|approaching/.test(t)) {
      var soon = open.filter(function (tk) { return taskState(tk) === 'approaching'; });
      return { title: 'DUE THIS WEEK', lead: soon.length ? titleCase(count(soon.length, 'task is', 'tasks are')) + ' approaching in the next seven days.' : 'Nothing is due in the next seven days.', ids: soon.map(function (tk) { return tk.id; }) };
    }
    if (/what should i do next|do next|what next/.test(t)) {
      var urgent = open.filter(function (tk) { return taskState(tk) === 'overdue' || taskState(tk) === 'approaching'; })
        .sort(function (a, b) { return daysFrom(a.due_at) - daysFrom(b.due_at); });
      if (urgent.length) { var tk = urgent[0]; return { title: 'DO NEXT', lead: '"' + tk.title + '" in ' + segName(tk.segment_id) + ' — ' + (taskState(tk) === 'overdue' ? 'overdue' : 'due soon') + '.', ids: [tk.id] }; }
      var byPri = open.filter(function (tk) { return taskState(tk) === 'pending'; }).sort(function (a, b) { return (b.priority === 'high') - (a.priority === 'high'); });
      if (byPri.length) return { title: 'DO NEXT', lead: '"' + byPri[0].title + '" in ' + segName(byPri[0].segment_id) + ' is your highest-priority open task.', ids: [byPri[0].id] };
      return { title: 'DO NEXT', lead: 'Nothing open right now — you’re caught up.', ids: [] };
    }
    var inMatch = t.match(/what do i have in ([a-z ]+)\??$/) || t.match(/\bin ([a-z ]+)\??$/);
    if (inMatch) {
      var needle = inMatch[1].trim();
      var seg = activeSegments().filter(function (s) { return s.name.toLowerCase().indexOf(needle) > -1; })[0];
      if (seg) {
        var rows = open.filter(function (tk) { return tk.segment_id === seg.id; });
        return { title: seg.name.toUpperCase(), lead: rows.length ? titleCase(count(rows.length, 'active task', 'active tasks')) + ' in ' + seg.name + '.' : 'Nothing active in ' + seg.name + '.', ids: rows.map(function (tk) { return tk.id; }) };
      }
    }
    var words = t.split(/\W+/).filter(function (w) { return w.length > 3; });
    var hits = open.filter(function (tk) { return words.some(function (w) { return tk.title.toLowerCase().indexOf(w) > -1 || (tk.notes || '').toLowerCase().indexOf(w) > -1; }); });
    return { title: hits.length ? 'WHAT I FOUND' : 'NOTHING MATCHED', lead: hits.length ? titleCase(count(hits.length, 'task looks', 'tasks look')) + ' like what you asked about.' : 'Try a segment name, a date, or a word from the task itself.', ids: hits.map(function (tk) { return tk.id; }) };
  }

  // ---------------------------------------------------------------- sync raw inputs into state

    'commit-segments': function () {

    'guide-submit': function () {
      syncFields();
      var text = (S.draft || '').trim();
      if (!text) return;
      var g = S.guide;
      g.heard = text;
      S.draft = '';
      // "Make/create a new segment called X" is a setup request, not a
      // task to parse — checked first (before isQuestion, since this
      // phrasing often ends in "?" too) so it doesn't get force-fit
      // through the task parser and come out as nonsense.
      var segCreateMatch = text.match(/\b(?:make|create|add|start)\b.*?\bsegment\b.*?\b(?:called|named|for)\b\s+(.+?)[\s.?!]*$/i);
      if (segCreateMatch) {
        var segName = titleCase(segCreateMatch[1].trim());
        if (!segName) { toast('What should the new segment be called?'); render(); return; }
        var afterSegCreate = function (s) {
          g.createdSegmentName = s.name;
          g.step = 'segment-created';
          if (S.settings.voiceSpoken) speak('Created a new segment: ' + s.name + '. Want to add a task to it now, or anything else' + greetName() + '?');
          render();
        };
        var newSegColor = SEG_PALETTE[S.segments.length % SEG_PALETTE.length];
        var newSegIcon = inferIcon(segName);
        if (API) {
          call('POST', '/api/segments', { name: segName, color: newSegColor, icon: newSegIcon }).then(function (s) { S.segments.push(s); afterSegCreate(s); });
        } else {
          var newSeg = { id: newId('sg'), user_id: 'u1', name: segName, icon: newSegIcon, color: newSegColor, sort_order: S.segments.length, status: 'active', archived_at: null, created_at: new Date().toISOString() };
          S.segments.push(newSeg);
          afterSegCreate(newSeg);
        }
        return;
      }
      // Mimi handles questions ("what's overdue?") the same way the "+"
      // quick-add does, so you don't need to remember a separate place to
      // ask vs. add — one mic, routed by what you actually said.
      if (isQuestion(text)) {
        var afterAnswer = function (a) {
          g.answerData = a;
          g.step = 'answer';
          if (S.settings.voiceSpoken) speak(a.lead);
          render();
        };
        if (API) {
          call('POST', '/api/assistant/query', { text: text, today: isoOf(TODAY) })
            .then(afterAnswer)
            .catch(function () { afterAnswer(localAnswer(text)); });
        } else {
          afterAnswer(localAnswer(text));
        }
        return;
      }
      // A confident segment guess and an unambiguous date mean nothing left
      // to ask — priority/reminder are pre-filled (from the phrase, or the
      // account default) rather than asked, so the very next thing shown is
      // the single combined "sound right?" check, not a chain of questions.
      var afterParse = function (p) {
        g.title = p.title;
        g.segmentGuess = p.segmentId || null;
        g.segmentId = p.segmentId || null;
        g.date = p.date || null;
        g.time = p.date ? (p.time || null) : null;
        g.followUp = p.followUp || null;
        g.alt = p.alt || null;
        g.priority = p.priority || 'normal';
        g.reminder = p.reminder || effectiveReminder(null);
        g.adjusting = null;
        g.step = 'confirm';
        if (S.settings.voiceSpoken) speak(guideSpokenText(g));
        render();
      };
      if (API) {
        call('POST', '/api/assistant/parse', { text: text, today: isoOf(TODAY) })
          .then(function (r) { afterParse((r.proposals || [])[0] || { title: text }); })
          .catch(function () { afterParse(localParseClause(text, 0)); });
      } else {
        afterParse(localParseClause(text, 0));
      }
    },
    'guide-pick-segment': function (v) {
      var g = S.guide;
      g.segmentId = v;
      if (S.settings.voiceSpoken) speak(guideSpokenText(g));
      render();
    },
    'guide-confirm-date': function (v) {
      var g = S.guide;
      if (v === 'alt' && g.alt) g.date = g.alt;
      if (v === 'none') { g.date = null; g.dateAsked = true; }
      g.followUp = null;

    'guide-quick-date': function (v) {
      var g = S.guide;
      g.dateAsked = true;
      if (v === 'today') g.date = isoOf(TODAY);
      else if (v === 'tomorrow') { var d = new Date(TODAY); d.setDate(d.getDate() + 1); g.date = isoOf(d); }

    // The voice/typed answer to whatever Mimi is currently asking in the
    // 'confirm' step — tapping a pill above is a shortcut through the same
    // state transitions, not the only way to answer; this is the path for
    // just saying the answer out loud instead. Each phase below mirrors
    // exactly what its own pill buttons do, so the two never disagree.
    'guide-voice-answer': function () {
      syncFields();
      var g = S.guide;
      var raw = (S.draft || '').trim();
      if (!raw) return;
      var t = raw.toLowerCase();
      S.draft = '';
      g.lastHeard = raw;
      var saidYes = /^(yes|yeah|yep|yup|correct|sounds? right|that'?s right|sure|go ahead)\b/.test(t);
      var saidNo = /no deadline|never mind|cancel|skip|none/.test(t);

      var seg = g.segmentId ? segmentById(g.segmentId) : null;
      var guess = g.segmentGuess ? segmentById(g.segmentGuess) : null;

      if (!seg) {
        var pick = (guess && saidYes) ? guess : (localMatchSegment(raw) || activeSegments().filter(function (s) { return t.indexOf(s.name.toLowerCase()) > -1; })[0]);
        if (!pick) { toast('Didn’t catch a segment — say its name, or tap one below.'); render(); return; }
        g.segmentId = pick.id;
        if (S.settings.voiceSpoken) speak(guideSpokenText(g));
        render();
        return;
      }

      if (g.followUp) {
        if (saidNo) { g.date = null; g.dateAsked = true; }
        else if (g.alt && /after|other one|next one|second one/.test(t)) { g.date = g.alt; }
        else if (saidYes) { /* keep the near guess already in g.date */ }
        else { var w1 = localResolveDate(t, TODAY); if (w1.date) { g.date = isoOf(w1.date); g.alt = w1.alt ? isoOf(w1.alt) : null; } }
        g.followUp = null;
        if (S.settings.voiceSpoken) speak(guideSpokenText(g));
        render();
        return;
      }

      if (!g.date && !g.dateAsked) {
        g.dateAsked = true;
        var when = localResolveDate(t, TODAY);
        if (when.date) {
          g.date = isoOf(when.date);
          g.time = localResolveTime(t);
          g.followUp = when.ambiguous ? when.question : null;
          g.alt = when.alt ? isoOf(when.alt) : null;
        } else {
          g.date = null;
        }
        if (S.settings.voiceSpoken) speak(guideSpokenText(g));
        render();
        return;
      }

      if (g.adjusting === 'priority') {
        var p = HIGH_PRIORITY.test(t) || /\bhigh\b/.test(t) ? 'high' : (LOW_PRIORITY.test(t) || /\blow\b/.test(t) ? 'low' : (/\b(normal|medium|regular)\b/.test(t) ? 'normal' : null));
        if (!p) { toast('Say high, medium, or low.'); render(); return; }
        g.priority = p;
        g.adjusting = null;
        if (S.settings.voiceSpoken) speak(guideSpokenText(g));
        render();
        return;
      }

      if (g.adjusting === 'reminder') {
        var r1 = /no reminder|^none$/.test(t) ? { mode: 'none' } : localReminderFrom('remind me ' + t);
        if (!r1) { toast('Try “15 minutes before,” “at the deadline,” or “no reminder.”'); render(); return; }
        g.reminder = r1;
        g.adjusting = null;
        if (S.settings.voiceSpoken) speak(guideSpokenText(g));
        render();
        return;
      }

      // Combined confirmation: an inline change ("make it high priority")
      // is applied immediately; saying yes (with or without a change in
      // the same breath) goes straight to creating the task.
      var changed = false;
      if (HIGH_PRIORITY.test(t)) { g.priority = 'high'; changed = true; }
      else if (LOW_PRIORITY.test(t)) { g.priority = 'low'; changed = true; }
      if (REMINDER_PHRASE.test(t)) {
        var r2 = /no reminder/.test(t) ? { mode: 'none' } : localReminderFrom(t);
        if (r2) { g.reminder = r2; changed = true; }
      }
      if (saidYes) { createGuideTask(); return; }
      if (changed) { if (S.settings.voiceSpoken) speak(guideSpokenText(g)); render(); return; }
      if (/priority/.test(t)) { g.adjusting = 'priority'; if (S.settings.voiceSpoken) speak(guideSpokenText(g)); render(); return; }
      if (/reminder/.test(t)) { g.adjusting = 'reminder'; if (S.settings.voiceSpoken) speak(guideSpokenText(g)); render(); return; }
      toast('Say “yes” to add it, or tell me what to change.');
      render();
    },

      var g = S.guide;
      g.adjusting = v;
      if (S.settings.voiceSpoken) speak(guideSpokenText(g));
      render();

  function createGuideTask() {
    onceSubmitting('create-guide-task', function () {
      var g = S.guide;
      var seg = segmentById(g.segmentId);
      var payload = { segment_id: g.segmentId, title: g.title, due_at: g.date || null, due_time: g.date ? (g.time || null) : null, priority: g.priority || 'normal', reminder: g.reminder };
      // A dated task gets its calendar link right in the confirmation
      // bubble below — no separate toggle or "connect a calendar" step —
      // so it's offered automatically the moment Mimi confirms the save.
      var after = function (t) {
        g.createdTitle = g.title;
        g.createdSegment = seg ? seg.name : '';
        g.createdCalendarUrl = t.due_at ? taskCalendarUrl(t, seg) : null;
        g.step = 'done';
        saveLocal();
        if (S.settings.voiceSpoken) {
          speak('Added ' + g.createdTitle + ' to ' + g.createdSegment + ', ' + priorityWord(g.priority).toLowerCase() + ' priority' +
            (g.date ? ', ' + dueChip(g.date).text.toLowerCase() + (g.time ? ' at ' + timeLabel(g.time) : '') : '') +
            (g.reminder && g.reminder.mode !== 'none' ? ', reminder ' + reminderLabel(g.reminder).toLowerCase() : '') +
            '. Anything else' + greetName() + '?');
        }
        render();
      };
      if (API) return call('POST', '/api/tasks', payload).then(function (t) { S.tasks.push(t); return after(t); });
      var t = Object.assign({ id: newId('t'), notes: '', status: 'open', reminder: null, calendar_event_id: null, completed_at: null, created_at: new Date().toISOString() }, payload);
      S.tasks.push(t);
      return after(t);
    });
  }

  // ---------------------------------------------------------------- voice
  // Two ways to turn speech into text, tried in order:
  //  1. The Web Speech API's SpeechRecognition — instant, on-device, but
  //     unsupported on every browser on iOS (they all run WebKit, which has
  //     never implemented the recognition half of the spec).
  //  2. Record-and-upload — records audio with MediaRecorder (which iOS
  //     Safari does support) and posts it to the backend's Whisper-backed
  //     /api/assistant/transcribe. Needs a live backend; there's nothing to
  //     upload to in local/no-backend mode.
  var rec = null;
  var mediaRec = null;
  var mediaChunks = [];
  var mediaStream = null;

  function toggleMic() {
    if (S.listening || S.transcribing) { stopMic(); return; }
    var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (Rec) return startSpeechRecognition(Rec);
    if (window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) return startRecording();
    toast('Voice isn’t supported in this browser — type instead.');
  }

  function startSpeechRecognition(Rec) {
    if (!window.isSecureContext) { toast('Voice needs a secure connection (https) — type instead.'); return; }
    rec = new Rec();
    rec.continuous = true; rec.interimResults = true; rec.lang = 'en-GB';
    // Each tap of the mic is a fresh take, not a continuation — replacing
    // the draft (rather than appending to whatever was there, including a
    // previous bad transcript) is what makes "record again" actually mean
    // "redo it," not "pile the new attempt on top of the wrong one."
    rec.onresult = function (e) {
      var t = '';
      for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      S.draft = t;
      render();
    };
    // A silent onerror just left the mic looking broken with no explanation —
    // surface what actually went wrong so "not-allowed" (permission blocked,
    // the common case inside an embedded/sandboxed page) reads as a fixable
    // instruction, not a dead button. "no-speech" fires routinely on a pause
    // and isn't worth a toast.
    rec.onerror = function (e) {
      var code = e && e.error;
      if (code !== 'no-speech') {
        toast(code === 'not-allowed' || code === 'service-not-allowed' ? 'Microphone access is blocked — allow it in your browser’s site settings, or type instead.'
          : code === 'audio-capture' ? 'No microphone found on this device — type instead.'
          : code === 'network' ? 'Voice needs a network connection — type instead.'
          : 'Voice ran into a problem — type instead.');
      }
      stopMic();
    };
    rec.onend = function () { S.listening = false; render(); };
    try { rec.start(); S.listening = true; render(); } catch (e) { toast('Couldn’t start the microphone.'); }
  }

  function startRecording() {
    if (!API) { toast('Voice needs a live backend in this browser — type instead.'); return; }
    if (!window.isSecureContext) { toast('Voice needs a secure connection (https) — type instead.'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      mediaStream = stream;
      // iOS Safari only speaks audio/mp4; Chrome/Android only speak
      // audio/webm — ask for whichever the browser actually supports
      // rather than assuming one.
      var candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
      var mimeType = candidates.filter(function (t) { return window.MediaRecorder.isTypeSupported(t); })[0] || '';
      mediaChunks = [];
      try { mediaRec = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream); }
      catch (e) { toast('Couldn’t start the microphone.'); stopStream(); return; }
      mediaRec.ondataavailable = function (e) { if (e.data && e.data.size) mediaChunks.push(e.data); };
      mediaRec.onstop = function () { var usedType = mediaRec ? mediaRec.mimeType : mimeType; mediaRec = null; uploadRecording(usedType); };
      mediaRec.start();
      S.listening = true; render();
    }).catch(function (e) {
      var name = e && e.name;
      toast(name === 'NotAllowedError' || name === 'SecurityError' ? 'Microphone access is blocked — allow it in your browser’s site settings, or type instead.'
        : name === 'NotFoundError' ? 'No microphone found on this device — type instead.'
        : 'Couldn’t start the microphone.');
    });
  }

  function uploadRecording(mimeType) {
    var blob = new Blob(mediaChunks, { type: mimeType || 'audio/webm' });
    mediaChunks = [];
    stopStream();
    S.listening = false;
    if (!blob.size) { render(); return; }
    S.transcribing = true; render();
    // Same as the live-recognition path: replace, don't append, so a
    // second recording is a clean redo instead of stacking a new
    // transcript onto whatever the last attempt got wrong.
    var reader = new FileReader();
    reader.onloadend = function () {
      var base64 = String(reader.result || '').split(',')[1] || '';
      call('POST', '/api/assistant/transcribe', { audio: base64, mimeType: mimeType || 'audio/webm' })
        .then(function (r) {
          S.transcribing = false;
          if (r && r.text) S.draft = r.text;
          else toast('Didn’t catch that — try again, or type instead.');
          render();
        })
        .catch(function (e) {
          S.transcribing = false;
          toast((e && e.message) || 'Transcription failed — type instead.');
          render();
        });
    };
    reader.readAsDataURL(blob);
  }

  function stopStream() { if (mediaStream) { mediaStream.getTracks().forEach(function (t) { t.stop(); }); mediaStream = null; } }

  function stopMic() {
    if (rec) { try { rec.stop(); } catch (e) {} rec = null; }
    if (mediaRec && mediaRec.state !== 'inactive') { try { mediaRec.stop(); } catch (e) {} return; } // onstop drives the rest
    mediaRec = null;
    S.listening = false;
    render();
  }

  // Text-to-speech for the "visual plus spoken response" voice preference —
  // §6.4 says never read sensitive task details in private mode, only the
  // summary line, which is all this ever passes in.
  //
  // Prefers a real, human-sounding voice (Google Cloud TTS, via the
  // backend) over the browser's own built-in speechSynthesis, which is
  // instant but sounds robotic. Falls back to the browser voice automatically
  // — no backend, no GOOGLE_TTS_API_KEY configured, or the network call
  // itself fails — so speech never just goes silent because the nicer
  // voice isn't set up.
  var currentAudio = null;
  function speak(text) {
    if (!text) return;
    if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
    if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    S.speaking = true; render();
    var done = function () { S.speaking = false; render(); };
    if (API) {
      call('POST', '/api/assistant/speak', { text: text }).then(function (r) {
        if (!r || !r.audio) return speakBrowser(text, done);
        try {
          var audio = new Audio('data:audio/mp3;base64,' + r.audio);
          currentAudio = audio;
          audio.onended = done; audio.onerror = function () { speakBrowser(text, done); };
          audio.play().catch(function () { speakBrowser(text, done); });
        } catch (e) { speakBrowser(text, done); }
      }).catch(function () { speakBrowser(text, done); });
    } else {
      speakBrowser(text, done);
    }
  }
  function speakBrowser(text, done) {
    if (!window.speechSynthesis) { done(); return; }
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 1; u.pitch = 1;
      u.onend = done; u.onerror = done;
      window.speechSynthesis.speak(u);
    } catch (e) { done(); }
  }

  // ---------------------------------------------------------------- render
  function render() {
    var root = document.getElementById('root');
    var html = (SCREENS[S.screen] ? SCREENS[S.screen]() : SCREENS.dashboard()) || '';
    // A screen guard (e.g. a since-deleted segment) can call go() to redirect
    // mid-render, which re-enters render() itself — that inner call already
    // painted the right screen, so don't let this call's now-stale, empty
    // return value overwrite it.
    if (!html) return;
    root.innerHTML = html;
    var searchIn = document.getElementById('search-in');
    if (searchIn) searchIn.focus();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var v = el.getAttribute('data-v');
    if (act === 'close-sheet' && e.target !== el) return;
    syncFields();
    if (ACTS[act]) ACTS[act](v, el);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'search-in') { S.search = e.target.value; render(); }
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'set-chosen-target') {
      S.chosenSegments[+e.target.getAttribute('data-i')].target_date = e.target.value || null;
    }
    if (e.target.id === 'ns-target-in') S.newSegment.target_date = e.target.value || null;
  });
  document.addEventListener('keydown', function (e) {
    // Enter used to call add-custom-segment without syncing the field
    // first, so it always read a stale (empty) S.customSegment and
    // silently did nothing — the button-click path worked because the
    // click handler runs syncFields() first, but this one didn't.
    if (e.key === 'Enter' && e.target.id === 'custom-segment-in') { e.preventDefault(); S.customSegment = e.target.value; ACTS['add-custom-segment'](); }
  });

  // ---------------------------------------------------------------- boot
  function boot() {
    var web = location.protocol === 'http:' || location.protocol === 'https:';
    var probe = web
      ? fetch('/api/health', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }, function () { return null; })
      : Promise.resolve(null);
    probe.then(function (h) {
      if (h && h.trackerApp) { API = location.origin; return loadFromApi(); }
      try { absorbLocal(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) {}
      return null;
    }).then(function () {
      if (S.onboarded) { S.screen = 'dashboard'; }
      render();
    }, function () { render(); });
  }
  boot();
})();
</script>
