<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5b4b8a; } a:hover { color: #453a6b; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f1f0f5; font-family: 'Manrope', system-ui, sans-serif; color: #232030; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 30px 20px 0; display: flex; flex-direction: column; gap: 5px;">
    <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.09em; color: #948eaa;">MONDAY EVENING</div>
    <div style="font-family: 'Fraunces', Georgia, serif; font-size: 27px; font-weight: 600; letter-spacing: -0.01em;">How today went</div>
  </div>

  <div style="margin: 15px 20px 0; display: flex; background: #e8e4f0; border-radius: 999px; padding: 3px; gap: 2px;">
    <div style="flex: 1; text-align: center; padding: 10px 0; border-radius: 999px; background: #ffffff; box-shadow: 0 1px 2px rgba(35,32,48,0.08); font-size: 12.5px; font-weight: 700;">Today</div>
    <div style="flex: 1; text-align: center; padding: 10px 0; font-size: 12.5px; font-weight: 700; color: #6e6880;">This week</div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 13px;">

    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px;">
      <div style="background: #ffffff; border: 1px solid #dcd6e8; border-radius: 14px; padding: 15px 8px; text-align: center;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 25px; font-weight: 600; color: #3d7a4d;">5</div>
        <div style="font-size: 11px; color: #6e6880; margin-top: 3px;">done</div>
      </div>
      <div style="background: #ffffff; border: 1px solid #dcd6e8; border-radius: 14px; padding: 15px 8px; text-align: center;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 25px; font-weight: 600;">2</div>
        <div style="font-size: 11px; color: #6e6880; margin-top: 3px;">still open</div>
      </div>
      <div style="background: #ffffff; border: 1px solid #dcd6e8; border-radius: 14px; padding: 15px 8px; text-align: center;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 25px; font-weight: 600; color: #a8451f;">3</div>
        <div style="font-size: 11px; color: #6e6880; margin-top: 3px;">late</div>
      </div>
    </div>

    <div style="background: #ffffff; border: 1px solid #dcd6e8; border-radius: 14px; padding: 14px 15px; display: flex; gap: 11px; align-items: flex-start;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3d7a4d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px;"><path d="M5 12l4.5 4.5L19 7"/></svg>
      <div style="flex: 1; font-size: 12.5px; color: #6e6880; line-height: 1.5;">A good day on the remodel — you cleared three of its four open items.</div>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-family: 'Fraunces', Georgia, serif; font-size: 15.5px; font-weight: 600;">Still open</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #948eaa;">2</div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 11px; background: #ffffff; border: 1px solid #dcd6e8; border-left: 4px solid #a8451f; border-radius: 14px; padding: 12px 13px;">
      <div style="width: 21px; height: 21px; border-radius: 50%; border: 2px solid #948eaa; flex: none; margin-top: 1px;"></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 14px; font-weight: 700; line-height: 1.35;">Send the Q3 update to Priya</div>
        <div style="display: flex; flex-wrap: wrap; gap: 4px 9px; align-items: center; font-size: 11.5px; color: #6e6880;">
          <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #3f6fa6;"></span>Work</span>
          <span>was due 5:00 PM</span>
        </div>
      </div>
      <div style="flex: none; display: flex; align-items: center; padding: 8px 12px; border-radius: 999px; background: #f1f0f5; font-size: 11.5px; font-weight: 700; color: #5b4b8a; min-height: 34px;">Tomorrow</div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 11px; background: #ffffff; border: 1px solid #dcd6e8; border-left: 4px solid #3f7561; border-radius: 14px; padding: 12px 13px;">
      <div style="width: 21px; height: 21px; border-radius: 50%; border: 2px solid #948eaa; flex: none; margin-top: 1px;"></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 14px; font-weight: 700; line-height: 1.35;">Flute practice</div>
        <div style="display: flex; flex-wrap: wrap; gap: 4px 9px; align-items: center; font-size: 11.5px; color: #6e6880;">
          <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #5b7a99;"></span>Hobbies</span>
          <span style="font-family: 'IBM Plex Mono', monospace;">↻ weekly</span>
        </div>
      </div>
      <div style="flex: none; display: flex; align-items: center; padding: 8px 12px; border-radius: 999px; background: #f1f0f5; font-size: 11.5px; font-weight: 700; color: #5b4b8a; min-height: 34px;">Skip</div>
    </div>

    <div style="text-align: center; padding: 14px 0; border-radius: 12px; background: #5b4b8a; color: #ffffff; font-size: 13px; font-weight: 700; margin-top: 2px;">Close out the day</div>

  </div>

  <div style="background: #ffffff; border-top: 1px solid #dcd6e8; padding: 9px 8px 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; color: #948eaa; font-size: 10.5px; font-weight: 700;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.6"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      Today
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; color: #948eaa; font-size: 10.5px; font-weight: 700;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h4l2 3h4l2-3h4"/><path d="M5.5 6h13L21 12v6a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18v-6z"/></svg>
      Inbox
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; color: #948eaa; font-size: 10.5px; font-weight: 700;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="5.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="15.5" width="7" height="4.5" rx="1.4"/><rect x="13.5" y="15.5" width="7" height="4.5" rx="1.4"/></svg>
      Projects
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; color: #5b4b8a; font-size: 10.5px; font-weight: 700;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.2"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/><path d="M8 14.5l2.4 2.4L16 11.5"/></svg>
      Review
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
