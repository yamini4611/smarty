<title>Smart Life Tracker</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #fafaf9;
    --paper: #ffffff;
    --ink: #1a1d21;
    --dim: #585e66;
    --faint: #8b9099;
    --accent: #1d3f63;
    --accent-deep: #14293f;
    --danger: #8c3a2b;
    --warn: #9c6b1f;
    --success: #2f5d50;
    --rule: #e4e4e0;
    --rule-hard: #1a1d21;
    --edge: #d8d8d3;
    --tint: #edf1f6;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: #eeeeea; color: var(--ink); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, textarea { font: inherit; color: inherit; }

  #phone { height: 100%; max-width: 430px; margin: 0 auto; background: var(--ground); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  @media (min-width: 460px) { body { padding-block: 20px; } #phone { height: min(100%, 880px); border: 1px solid var(--edge); } }

  .head { flex: none; padding: 20px 24px 0; background: var(--ground); }
  .head-rule { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--rule-hard); padding-bottom: 9px; }
  .wordmark { font-family: var(--serif); font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 24px; }
  .scroll.pad-bottom { padding-bottom: 28px; }

  .label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; color: var(--faint); text-transform: uppercase; }
  .label-sm { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; color: var(--faint); text-transform: uppercase; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 24px; }
  .sec:first-child { margin-top: 22px; }
  .sec + .hr { margin-top: 8px; }
  .hr { height: 1px; background: var(--rule-hard); }
  .row { display: flex; align-items: flex-start; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--rule); width: 100%; }
  .row:active { background: #f2f2ee; }
  .sq { flex: none; width: 6px; height: 6px; margin-top: 5px; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; }
  .title-line { font-size: 14.5px; font-weight: 500; line-height: 1.35; }
  .meta { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; color: var(--faint); margin-top: 5px; text-transform: uppercase; }
  .when { flex: none; font-family: var(--mono); font-size: 10px; color: var(--dim); padding-top: 2px; font-variant-numeric: tabular-nums; }
  .when.late { color: var(--danger); }
  .display { font-family: var(--serif); font-weight: 500; letter-spacing: -0.018em; line-height: 1.22; }
  .lede { font-size: 14px; line-height: 1.6; color: var(--dim); }

  .btn { display: block; width: 100%; text-align: center; padding: 17px 20px; font-size: 14.5px; font-weight: 500; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active { background: var(--accent-deep); }
  .btn-outline { border: 1px solid var(--edge); background: var(--paper); }
  .btn-quiet { color: var(--accent); font-size: 13.5px; padding: 13px 20px; }
  .btn-danger { color: var(--danger); }
  .btn[disabled] { color: var(--faint); background: var(--paper); border: 1px solid var(--edge); cursor: default; }
  .foot { flex: none; padding: 0 24px 28px; display: flex; flex-direction: column; gap: 10px; background: var(--ground); }

  .capture { flex: none; margin: 14px 24px 0; border: 1px solid var(--edge); background: var(--paper); display: flex; align-items: center; gap: 10px; padding: 13px 16px; }
  .capture:active { background: #f7f7f4; }
  .capture-text { flex: 1; font-size: 13.5px; color: var(--faint); }
  .nav { flex: none; background: var(--paper); border-top: 1px solid var(--rule); display: grid; grid-template-columns: repeat(2, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); position: relative; }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 14px; }
  .nav .label-sm { color: var(--faint); }
  .nav button[aria-current="page"] { box-shadow: inset 0 2px 0 var(--accent); }
  .nav button[aria-current="page"] .label-sm { color: var(--accent); }
  .fab { position: absolute; right: 20px; top: -25px; width: 50px; height: 50px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(26,29,33,0.25); }
  .fab:active { background: var(--accent-deep); }

  .tile { flex: 1; }
  .tile .n { font-family: var(--mono); font-size: 24px; font-weight: 500; line-height: 1; }
  .stats { display: flex; gap: 22px; margin-top: 16px; }
  .chip { flex: none; border: 1px solid var(--edge); background: var(--paper); padding: 7px 11px; display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 13px 24px 0; flex: none; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .box { background: var(--tint); padding: 14px 16px; margin-top: 20px; }
  .check { flex: none; width: 19px; height: 19px; border: 1px solid var(--edge); background: var(--paper); display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .toggle { flex: none; width: 38px; height: 22px; border: 1px solid var(--edge); background: var(--paper); position: relative; }
  .toggle i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #c9c9c3; }
  .toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .toggle[aria-checked="true"] i { left: auto; right: 2px; background: #fff; }
  .field { display: flex; align-items: center; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--rule); width: 100%; }
  .field-k { flex: none; width: 106px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; color: var(--faint); text-transform: uppercase; }
  .field-v { flex: 1; font-size: 14.5px; font-weight: 500; }
  .field-v.empty { color: var(--faint); font-weight: 400; }
  .quote { font-family: var(--serif); font-size: 20px; font-style: italic; line-height: 1.45; letter-spacing: -0.008em; padding-left: 14px; border-left: 2px solid var(--ink); }
  .done { text-decoration: line-through; color: var(--faint); }
  .empty-note { font-size: 13px; color: var(--faint); line-height: 1.6; padding: 18px 0; }

  .sheet-wrap { position: absolute; inset: 0; background: rgba(26,29,33,0.32); display: flex; align-items: flex-end; z-index: 20; }
  .sheet { width: 100%; background: var(--ground); max-height: 92%; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
  .toast { position: absolute; left: 24px; right: 24px; bottom: 96px; background: var(--ink); color: #fff; padding: 13px 16px; font-size: 13px; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .toast button { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; color: #fff; text-transform: uppercase; }
  .rec-dot { width: 7px; height: 7px; background: var(--danger); border-radius: 50%; }

  .type-in { width: 100%; border: none; background: transparent; font-family: var(--serif); font-size: 21px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.3; resize: none; outline: none; }
  .type-in::placeholder { color: var(--faint); }
  .note-in { width: 100%; border: 1px solid var(--edge); background: var(--paper); padding: 12px 14px; font-size: 13.5px; line-height: 1.5; resize: none; outline: none; min-height: 70px; }
  .text-in { width: 100%; border: none; border-bottom: 1px solid var(--edge); background: transparent; padding: 8px 0; font-size: 15px; outline: none; }
  .text-in:focus { border-color: var(--accent); }

  .stepper { display: flex; gap: 4px; margin-top: 14px; }
  .stepper i { flex: 1; height: 3px; background: var(--rule); }
  .stepper i.on { background: var(--accent); }

  .pillrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .pill { border: 1px solid var(--edge); background: var(--paper); padding: 8px 13px; font-size: 12.5px; font-weight: 500; color: var(--dim); }
  .pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .pill.warn[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); }

  .track { height: 4px; background: var(--rule); margin-top: 10px; }
  .track i { display: block; height: 100%; background: var(--accent); }

  .example-frame { border: 1px dashed var(--edge); padding: 14px; margin-top: 18px; position: relative; }
  .example-tag { position: absolute; top: -9px; left: 12px; background: var(--ground); padding: 0 6px; font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.1em; color: var(--faint); }
  .pcard { display: flex; align-items: flex-start; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
  .pcard:last-child { border-bottom: none; }

  .followup { background: var(--tint); border-left: 2px solid var(--accent); padding: 13px 15px; margin-top: 14px; font-size: 13.5px; line-height: 1.55; }
  .followup .opts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
</style>

<script>
(function () {
  'use strict';
  var TODAY = new Date();
  var DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var MON_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var WORDS = ['no','one','two','three','four','five','six','seven','eight','nine'];

  function d0(y, m, day) { return new Date(y, m, day); }
  function startOfDay(dt) { return d0(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
  function daysFrom(iso) { if (!iso) return null; var dt = new Date(iso + 'T00:00:00'); return Math.round((startOfDay(dt) - startOfDay(TODAY)) / 86400000); }
  function shortDate(dt) { return DAYS[dt.getDay()] + ' ' + dt.getDate(); }
  function monDate(dt) { return dt.getDate() + ' ' + MON[dt.getMonth()]; }
  function longDate(dt) { return DAYS_FULL[dt.getDay()] + ' ' + dt.getDate() + ' ' + MON_FULL[dt.getMonth()]; }
  function isoOf(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
  function relativeIso(iso) {
    if (!iso) return 'NO DEADLINE';
    var n = daysFrom(iso);
    if (n < 0) return (n === -1 ? 'YESTERDAY' : Math.abs(n) + ' DAYS AGO');
    if (n === 0) return 'TODAY';
    if (n === 1) return 'TOMORROW';
    if (n < 7) return DAYS[new Date(iso + 'T00:00:00').getDay()] + ' · ' + n + 'D';
    return monDate(new Date(iso + 'T00:00:00')).toUpperCase();
  }
  function count(n, sing, plur) { return (n < 10 ? WORDS[n] : n) + ' ' + (n === 1 ? sing : plur); }
  function titleCase(s) { s = (s || '').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var STATUS_COLOR = { red: 'var(--danger)', yellow: 'var(--warn)', green: 'var(--success)', gray: 'var(--faint)' };
  var STATUS_WORD = { red: 'Needs attention', yellow: 'Watch this', green: 'On track', gray: 'Paused' };

  var LIFE_AREAS = ['Work', 'Personal', 'Health', 'Home', 'School', 'Travel', 'Finances'];

  var uidCounter = 1000;
  function newId(prefix) { return prefix + (++uidCounter); }

  // ---------------------------------------------------------------- state
  var S = {
    screen: 'welcome',
    onboarded: false,
    onboardStep: 0,          // index into projects needing setup
    filter: 'all',           // all | attention | upcoming
    openProjectId: null,
    sheet: null,
    sheetTab: null,
    toast: null,
    heard: '', heardLen: '',
    proposals: [],
    followUp: null,
    answerData: null,
    thinking: false,
    listening: false,
    draft: null,
    chosenAreas: ['Work', 'Home', 'Health'],
    customArea: '',
    user: { display_name: '', email: '' },
    settings: { notification_defaults: { mode: 'before', offsetDays: 1, atHour: 9 } },
    integration: { status: 'disconnected' },
    projects: [],
    tasks: [],
    search: ''
  };

  // ---------------------------------------------------------------- persistence
  var API = null;
  var KEY = 'tracker.demo.v1';

  function snapshot() {
    return { onboarded: S.onboarded, chosenAreas: S.chosenAreas, user: S.user, settings: S.settings, integration: S.integration, projects: S.projects, tasks: S.tasks };
  }
  function absorbLocal(st) {
    if (!st) return;
    S.onboarded = !!st.onboarded;
    if (st.chosenAreas) S.chosenAreas = st.chosenAreas;
    if (st.user) S.user = st.user;
    if (st.settings) S.settings = st.settings;
    if (st.integration) S.integration = st.integration;
    if (st.projects) S.projects = st.projects;
    if (st.tasks) S.tasks = st.tasks;
  }
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(snapshot())); } catch (e) {} }

  function call(method, path, payload) {
    return fetch(API + path, {
      method: method,
      headers: payload !== undefined ? { 'Content-Type': 'application/json' } : undefined,
      body: payload !== undefined ? JSON.stringify(payload) : undefined
    }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(r.status)); });
  }

  function loadFromApi() {
    return Promise.all([
      call('GET', '/api/me'),
      call('GET', '/api/projects'),
      call('GET', '/api/tasks'),
      call('GET', '/api/integrations')
    ]).then(function (r) {
      S.user = r[0] || S.user;
      if (r[0] && r[0].notification_defaults) S.settings.notification_defaults = JSON.parse(r[0].notification_defaults);
      S.projects = r[1] || [];
      S.tasks = r[2] || [];
      var gcal = (r[3] || []).find(function (i) { return i.provider === 'google_calendar'; });
      if (gcal) S.integration = gcal;
      S.onboarded = S.projects.length > 0;
    });
  }

  // ---------------------------------------------------------------- status engine
  // Mirrors backend/status.js exactly, rule for rule, so the fallback mode
  // never disagrees with the server about what's red, yellow, green or gray.
  function computeStatus(p, tasks) {
    if (p.status_override) return { status: p.status_override, reason: 'Set manually.', task: null, manual: true };
    if (p.archived_at) return { status: 'gray', reason: 'Archived.', task: null };
    var open = tasks.filter(function (t) { return t.project_id === p.id && t.status === 'open'; });

    var overdue = open.filter(function (t) { return t.due_at && daysFrom(t.due_at) < 0; })
      .sort(function (a, b) { return daysFrom(a.due_at) - daysFrom(b.due_at); });
    if (overdue.length) {
      var n = -daysFrom(overdue[0].due_at);
      return { status: 'red', reason: '"' + overdue[0].title + '" is ' + n + ' day' + (n === 1 ? '' : 's') + ' overdue.', task: overdue[0] };
    }
    var urgent = open.filter(function (t) { return t.priority === 'high' && t.due_at && daysFrom(t.due_at) === 0; });
    if (urgent.length) return { status: 'red', reason: '"' + urgent[0].title + '" is high priority and due within 24 hours.', task: urgent[0] };

    var soon = open.filter(function (t) { return t.due_at && daysFrom(t.due_at) >= 0 && daysFrom(t.due_at) <= 7; })
      .sort(function (a, b) { return daysFrom(a.due_at) - daysFrom(b.due_at); });
    if (soon.length) {
      var sn = daysFrom(soon[0].due_at);
      return { status: 'yellow', reason: '"' + soon[0].title + '" is due ' + (sn === 0 ? 'today' : 'in ' + sn + ' day' + (sn === 1 ? '' : 's')) + '.', task: soon[0] };
    }
    var blocked = open.filter(function (t) { return t.blocked; });
    if (blocked.length) return { status: 'yellow', reason: '"' + blocked[0].title + '" is blocked.', task: blocked[0] };
    if (!open.length) return { status: 'yellow', reason: 'No next task is set for this project.', task: null };

    var next = nextTaskOf(p, tasks);
    return { status: 'green', reason: next.due_at ? '"' + next.title + '" is next, due ' + next.due_at + '.' : '"' + next.title + '" is next.', task: next };
  }
  function nextTaskOf(p, tasks) {
    var open = tasks.filter(function (t) { return t.project_id === p.id && t.status === 'open'; });
    if (!open.length) return null;
    return open.slice().sort(function (a, b) {
      if (!a.due_at && !b.due_at) return 0;
      if (!a.due_at) return 1;
      if (!b.due_at) return -1;
      return new Date(a.due_at) - new Date(b.due_at);
    })[0];
  }
  function effectiveReminder(task, project, user) {
    return (task && task.reminder) || (project && project.reminder_default) || (user && user.settings) || { mode: 'none' };
  }
  function reminderLabel(r) {
    if (!r || r.mode === 'none') return 'No reminder';
    if (r.mode === 'at_deadline') return 'At the deadline';
    if (r.mode === 'before') return (r.offsetDays || 1) + ' day' + ((r.offsetDays || 1) === 1 ? '' : 's') + ' before, ' + (r.atHour || 9) + ':00';
    if (r.mode === 'repeat') return 'Repeats ' + (r.repeatRule || 'weekly');
    return 'No reminder';
  }

  function decorateProject(p) {
    var tasks = S.tasks;
    var s = computeStatus(p, tasks);
    var next = nextTaskOf(p, tasks);
    var open = tasks.filter(function (t) { return t.project_id === p.id && t.status === 'open'; });
    var done = tasks.filter(function (t) { return t.project_id === p.id && t.status === 'completed'; });
    var overdueCount = open.filter(function (t) { return t.due_at && daysFrom(t.due_at) < 0; }).length;
    return Object.assign({}, p, {
      status: s.status, statusReason: s.reason, manualStatus: !!s.manual,
      nextTask: next, openCount: open.length, doneCount: done.length, overdueCount: overdueCount
    });
  }
  function activeProjects() { return S.projects.filter(function (p) { return !p.archived_at; }).map(decorateProject); }
  function projectById(id) { return S.projects.filter(function (p) { return p.id === id; })[0] || null; }
  function taskById(id) { return S.tasks.filter(function (t) { return t.id === id; })[0] || null; }
  function openTasksOf(pid) { return S.tasks.filter(function (t) { return t.project_id === pid && t.status === 'open'; }); }
  function doneTasksOf(pid) { return S.tasks.filter(function (t) { return t.project_id === pid && t.status === 'completed'; }); }

  function dashboardData() {
    var projects = activeProjects();
    var dueToday = S.tasks.filter(function (t) { return t.status === 'open' && t.due_at && daysFrom(t.due_at) === 0; }).length;
    var overdue = S.tasks.filter(function (t) { return t.status === 'open' && t.due_at && daysFrom(t.due_at) < 0; }).length;
    var needsAttention = projects.filter(function (p) { return p.status === 'red' || p.status === 'yellow'; }).length;
    var completedThisWeek = S.tasks.filter(function (t) { return t.status === 'completed' && t.completed_at && daysFrom(t.completed_at.slice(0, 10)) >= -7; }).length;
    var attention = projects.filter(function (p) { return p.status === 'red' || p.status === 'yellow'; })
      .sort(function (a, b) { return (a.status === 'red' ? 0 : 1) - (b.status === 'red' ? 0 : 1); });
    return { summary: { dueToday: dueToday, overdue: overdue, needsAttention: needsAttention, completedThisWeek: completedThisWeek }, projects: projects, attention: attention };
  }

  // ---------------------------------------------------------------- icons & chrome
  var IC = {
    back: 'M15 5l-7 7 7 7',
    mic: 'M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3zM7 11a5 5 0 0010 0M12 18v3',
    plus: 'M12 5v14M5 12h14',
    check: 'M5 12.5l4.5 4.5L19 7.5',
    chev: 'M9 5l7 7-7 7',
    bell: 'M6 9a6 6 0 1112 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9zM10 19a2 2 0 004 0',
    profile: 'M12 12a4 4 0 100-8 4 4 0 000 8zM5 20a7 7 0 0114 0',
    search: 'M11 4a7 7 0 105.3 12l3.2 3.2 1.4-1.4L17.7 14.6A7 7 0 0011 4z',
    calendar: 'M4 6.5h16M7 3.5v5M17 3.5v5M4.5 6.5h15v14h-15z',
    archive: 'M4 6h16l-1.4 13.2A2 2 0 0116.6 21H7.4a2 2 0 01-2-1.8L4 6zM2.5 3.5h19v3h-19zM10 12h4'
  };
  function svg(path, size, color, weight) {
    return '<svg width="' + (size || 16) + '" height="' + (size || 16) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="' + (weight || 1.6) + '" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="' + path + '"/></svg>';
  }
  function sq(color) { return '<span class="sq" style="background:' + color + '"></span>'; }
  function dot(color) { return '<span class="dot" style="background:' + color + '"></span>'; }

  function go(screen, opts) { S.screen = screen; if (opts) Object.assign(S, opts); render(); }
  function toast(msg) { S.toast = msg; render(); setTimeout(function () { if (S.toast === msg) { S.toast = null; render(); } }, 2600); }
  function openSheet(name, v) { S.sheet = name; if (v !== undefined) S.sheetV = v; render(); }
  function closeSheet() { S.sheet = null; S.sheetV = null; render(); }

  function header(left, right) {
    return '<div class="head"><div class="head-rule"><div class="wordmark">' + left + '</div>' + (right || '') + '</div></div>';
  }
  function sectionHead(label, right) {
    return '<div class="sec"><div class="label">' + label + '</div>' + (right ? '<div class="label" style="color:var(--dim)">' + right + '</div>' : '') + '</div><div class="hr"></div>';
  }
  function backHeader(title, act, v) {
    return '<div class="head"><div style="display:flex;align-items:center;gap:12px;padding-bottom:14px">' +
      '<button data-act="' + act + '" data-v="' + (v || '') + '" style="flex:none;padding:4px">' + svg(IC.back, 20) + '</button>' +
      '<div class="wordmark" style="font-size:17px">' + esc(title) + '</div></div></div>';
  }

  function navBar() {
    var tabs = [{ id: 'dashboard', label: 'DASHBOARD', icon: 'M4 20V9.6L12 3.5l8 6.1V20H4z' }, { id: 'progress', label: 'PROGRESS', icon: 'M4 19h16M7 19V9M12 19V5M17 19v-7' }];
    return '<div class="nav">' + tabs.map(function (t) {
      var on = S.screen === t.id;
      return '<button data-act="tab" data-v="' + t.id + '"' + (on ? ' aria-current="page"' : '') + '>' +
        svg(t.icon, 18, on ? 'var(--accent)' : 'var(--faint)') + '<span class="label-sm">' + t.label + '</span></button>';
    }).join('') +
      '<button class="fab" data-act="go" data-v="add-task">' + svg(IC.plus, 22, '#fff', 2) + '</button></div>';
  }

  function statusChip(status, reason) {
    return '<div style="display:flex;align-items:center;gap:8px">' + dot(STATUS_COLOR[status]) +
      '<span style="font-size:12.5px;font-weight:500">' + STATUS_WORD[status] + '</span></div>' +
      (reason ? '<div class="meta" style="text-transform:none;margin-top:3px;letter-spacing:0">' + esc(reason) + '</div>' : '');
  }

  function projectRow(p, opts) {
    opts = opts || {};
    var bar = p.openCount + p.doneCount ? Math.round(100 * p.doneCount / (p.openCount + p.doneCount)) : 0;
    return '<button class="row" data-act="open-project" data-v="' + p.id + '" style="flex-direction:column;align-items:stretch;gap:8px">' +
      '<div style="display:flex;align-items:flex-start;gap:11px;width:100%">' +
        dot(STATUS_COLOR[p.status]) +
        '<div style="flex:1;min-width:0">' +
          '<div class="title-line">' + esc(p.name) + '</div>' +
          '<div class="meta">' + (p.nextTask ? esc(p.nextTask.title) : 'No next task') + '</div>' +
        '</div>' +
        '<div class="when' + (p.overdueCount ? ' late' : '') + '" style="text-align:right">' +
          (p.nextTask && p.nextTask.due_at ? relativeIso(p.nextTask.due_at) : (p.nextTask ? 'NO DATE' : '—')) +
          (p.overdueCount ? '<div style="margin-top:2px">' + p.overdueCount + ' OVERDUE</div>' : '') +
        '</div>' +
      '</div>' +
      (opts.bar === false ? '' : '<div class="track"><i style="width:' + bar + '%;background:' + (p.status === 'red' ? 'var(--danger)' : 'var(--accent)') + '"></i></div>') +
    '</button>';
  }

  function taskRow(t, opts) {
    opts = opts || {};
    var p = projectById(t.project_id);
    var late = t.status === 'open' && t.due_at && daysFrom(t.due_at) < 0;
    return '<div class="row">' +
      (opts.checkable === false ? '' : '<button class="check" data-act="toggle-task" data-v="' + t.id + '" role="checkbox" aria-checked="' + (t.status === 'completed') + '" aria-label="Mark done">' + (t.status === 'completed' ? svg(IC.check, 11, '#fff', 2.4) : '') + '</button>') +
      '<button class="row" data-act="open-task" data-v="' + t.id + '" style="border:none;padding:0;flex:1;min-width:0">' +
        '<div style="flex:1;min-width:0">' +
          '<div class="title-line' + (t.status === 'completed' ? ' done' : '') + '">' + esc(t.title) +
            (t.priority === 'high' ? ' <span style="color:var(--danger);font-size:11px">●</span>' : '') +
            (t.blocked ? ' <span class="label-sm" style="color:var(--warn)">BLOCKED</span>' : '') +
            (t.calendar_event_id ? ' ' + svg(IC.calendar, 11, 'var(--faint)') : '') +
          '</div>' +
          (opts.project !== false && p ? '<div class="meta">' + esc(p.name) + '</div>' : '') +
        '</div>' +
        '<div class="when' + (late ? ' late' : '') + '">' + (t.due_at ? relativeIso(t.due_at) : 'NO DEADLINE') + '</div>' +
      '</button>' +
    '</div>';
  }

  function captureBar(placeholder) {
    return '<button class="capture" data-act="go" data-v="add-task">' + svg(IC.mic, 16, 'var(--accent)') +

        '<h1 class="display" style="font-size:32px;margin:18px 0 0">Stay ahead of what you’re responsible for.</h1>' +
        '<p class="lede" style="margin-top:16px">One place to capture your projects and tasks, see what needs you first, and get out from under the mental load of tracking it all yourself.</p>' +

        '<div style="flex:1"></div>' +
      '</div>' +
      '<div class="foot" style="flex-direction:row;gap:10px">' +
        '<button class="btn btn-outline" data-act="mic" style="flex:none;width:52px;display:flex;align-items:center;justify-content:center">' + svg(IC.mic, 18, S.listening ? 'var(--danger)' : 'var(--ink)') + '</button>' +
        '<button class="btn btn-primary" data-act="submit-onboard-say" style="flex:1">Add these</button>' +
      '</div>';
  };

  SCREENS['project-setup'] = function () {
    var list = activeProjects().filter(function (p) { return !p.setupDone; });
    var idx = Math.min(S.onboardStep, Math.max(0, S.projects.length - 1));
    var p = S.projects[idx];

    var task = openTasksOf(p.id)[0];
    return backHeader(p.name, 'skip-setup') +
      '<div class="scroll pad-bottom">' +
        '<div class="stepper">' + S.projects.map(function (_, i) { return '<i class="' + (i <= idx ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
        '<div class="label" style="margin-top:10px">PROJECT ' + (idx + 1) + ' OF ' + S.projects.length + '</div>' +
        '<h1 class="display" style="font-size:22px;margin-top:8px">' + esc(p.name) + '</h1>' +
        sectionHead('WHAT DOES SUCCESS LOOK LIKE?') +
        '<textarea class="note-in" id="setup-desc-in" placeholder="A sentence or two…" style="margin-top:12px">' + esc(p.description || '') + '</textarea>' +
        sectionHead('WHAT’S THE NEXT MILESTONE?') +

  // ---------------------------------------------------------------- local parser (fallback mode)
  // Mirrors backend/assistant.js so the demo behaves identically with or
  // without a server behind it.
  var WD = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  var TASK_VERBS = /^(call|pay|submit|book|schedule|tour|prepare|review|send|confirm|finish|complete|apply|buy|renew|sign|visit|email|draft|file|attend|pick up|drop off|order|check|arrange|follow up|register|update|clean|fix|pack|meet|interview)\b/i;
  var REMINDER_PHRASE = /\bremind me\b|\breminder\b/i;
  var HIGH_PRIORITY = /\burgent\b|\basap\b|\bimmediately\b|\bcritical\b/i;

  function localResolveDate(t, today) {
    var add = function (n) { var x = new Date(today); x.setDate(x.getDate() + n); return x; };
    var m;
    if (/\btomorrow\b/.test(t)) return { date: add(1) };
    if (/\btoday\b|\btonight\b/.test(t)) return { date: add(0) };
    if ((m = t.match(/\bin (\d+) days?\b/))) return { date: add(parseInt(m[1], 10)) };
    if ((m = t.match(/\bnext (sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))) {
      var delta1 = (WD.indexOf(m[1]) - today.getDay() + 7) % 7; if (delta1 === 0) delta1 = 7; delta1 += 7;
      return { date: add(delta1) };
    }
    if ((m = t.match(/\b(?:on |by )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))) {
      var delta2 = (WD.indexOf(m[1]) - today.getDay() + 7) % 7; if (delta2 === 0) delta2 = 7;
      var near = add(delta2), following = add(delta2 + 7);
      return { date: near, ambiguous: true, question: 'Do you mean this ' + titleCase(m[1]) + ' (' + monDate(near) + '), or the ' + titleCase(m[1]) + ' after (' + monDate(following) + ')?', alt: following };
    }
    if ((m = t.match(/\b(?:on |by |the )(\d{1,2})(?:st|nd|rd|th)\b/))) {
      var day = parseInt(m[1], 10);
      var x = new Date(today.getFullYear(), today.getMonth(), day);
      if (x < today) x = new Date(today.getFullYear(), today.getMonth() + 1, day);
      return { date: x };
    }
    if (/\bnext week\b/.test(t)) return { date: add(7), ambiguous: true, question: 'Which day next week?' };
    if (/\bend of the month\b|\bthis month\b/.test(t)) return { date: new Date(today.getFullYear(), today.getMonth() + 1, 0), ambiguous: true, question: 'Which day this month?' };
    return {};
  }
  function localReminderFrom(clause) {
    if (!REMINDER_PHRASE.test(clause)) return null;
    return { mode: 'before', offsetDays: 1, atHour: 9, needsConfirm: true };
  }
  function localSplitClauses(text) {
    var parts = String(text).split(/\s+and (?:then )?(?=\w)|[;.]\s+|,\s+(?:and\s+)?(?:also|then)\s+/i).map(function (c) { return c.trim(); }).filter(function (c) { return c.length > 2; });
    // A trailing "...and remind me..." is part of the task before it, not a
    // separate responsibility — reattach it rather than treat it as its own item.
    var merged = [];
    parts.forEach(function (c) {
      if (/^remind me\b/i.test(c) && merged.length) merged[merged.length - 1] += ' and ' + c;
      else merged.push(c);
    });
    return (merged.length ? merged : [String(text)]).slice(0, 4);
  }
  function localCleanTitle(raw) {
    return raw.trim()
      .replace(/^(i need to|i have to|i must|i should|please|can you|remind me to|remember to|don'?t forget to|i want to)\s+/i, '')
      .replace(/^for (?:my |our |the )?[^,]{1,40},\s*/i, '')
      .replace(/,?\s*(?:and\s+)?remind me (?:the day before|of it|about it)\b.*/i, '')
      .replace(/\b(?:on |by )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/gi, '')
      .replace(/\b(tomorrow|today|tonight|next week|this month|end of the month)\b/gi, '')
      .replace(/\bin \d+ days?\b/gi, '')
      .replace(/\b(?:on |by |before )?the \d{1,2}(?:st|nd|rd|th)\b/gi, '')
      .replace(/,?\s*\b(?:urgent|asap|immediately|critical)\b\.?/gi, '')
      .replace(/\s{2,}/g, ' ').replace(/\s+([,.])/g, '$1').replace(/[,\s]+$/, '').trim();
  }
  function localMatchProject(clause) {
    var t = clause.toLowerCase(), best = null, bestScore = 0;
    activeProjects().forEach(function (p) {
      var words = p.name.toLowerCase().split(/\W+/).filter(function (w) { return w.length > 3; });
      var score = words.filter(function (w) { return t.indexOf(w) > -1; }).length;

  }
  function localParse(text) {
    var today = TODAY;
    return localSplitClauses(text).map(function (raw, i) {
      var t = raw.toLowerCase();
      var when = localResolveDate(t, today);
      var project = localMatchProject(raw);
      var title = titleCase(localCleanTitle(raw)) || titleCase(raw.trim());
      if (!project) {
        var mgmt = t.match(/\b(?:stay|keep|staying|keeping)\s+(?:on top of|current on|up to date on)\s+(.+)$|\b(?:manage|managing|track|tracking|handle|handling)\s+(.+)$/i);
        if (mgmt) {
          var rem = (mgmt[1] || mgmt[2] || '').trim();
          return { id: 'p' + (i + 1), kind: 'project', title: rem ? titleCase(rem) : title, followUp: null };
        }
      }
      var isTaskShaped = TASK_VERBS.test(t.trim()) || when.date || /\bappointment\b|\bmeeting\b/.test(t);
      if (isTaskShaped) {
        return { id: 'p' + (i + 1), kind: 'task', title: title, projectId: project ? project.id : null, projectName: project ? project.name : null,
          needsProjectChoice: !project, date: when.date ? isoOf(when.date) : null, dateAmbiguous: !!when.ambiguous, followUp: when.question || null,
          alt: when.alt ? isoOf(when.alt) : null, priority: HIGH_PRIORITY.test(t) ? 'high' : 'normal', reminder: localReminderFrom(raw) };
      }
      if (!project && raw.trim().split(/\s+/).length <= 5) return { id: 'p' + (i + 1), kind: 'project', title: title, followUp: null };
      return { id: 'p' + (i + 1), kind: 'ambiguous', title: title, followUp: 'Is "' + title + '" a new project, or a task inside ' + (project ? project.name : 'an existing project') + '?', projectId: project ? project.id : null, projectName: project ? project.name : null };
    });
  }
  function localAnswer(text) {
    var t = text.toLowerCase(), now = TODAY;
    if (/falling behind|overdue|late|behind|slipping|missed/.test(t)) {
      var rows = activeProjects().filter(function (p) { return p.status === 'red'; });
      return { title: 'FALLING BEHIND', lead: rows.length ? titleCase(count(rows.length, 'project needs', 'projects need')) + ' attention right now.' : 'Nothing is red. Everything still has time on it.',
        list: rows.map(function (p) { return { project: p.name, reason: p.statusReason }; }) };
    }
    if (/due this week|this week|next few days|coming up/.test(t)) {
      var soon = S.tasks.filter(function (tk) { return tk.status === 'open' && tk.due_at && daysFrom(tk.due_at) >= 0 && daysFrom(tk.due_at) <= 7; }).sort(function (a, b) { return daysFrom(a.due_at) - daysFrom(b.due_at); });
      return { title: 'DUE THIS WEEK', lead: soon.length ? titleCase(count(soon.length, 'task falls', 'tasks fall')) + ' inside the next seven days.' : 'Nothing is due in the next seven days.', ids: soon.map(function (tk) { return tk.id; }) };
    }
    if (/\btoday\b/.test(t)) {

      return { title: 'DUE TODAY', lead: dt.length ? titleCase(count(dt.length, 'task is', 'tasks are')) + ' due today.' : 'Nothing is due today.', ids: dt.map(function (tk) { return tk.id; }) };
    }
    var words = t.split(/\W+/).filter(function (w) { return w.length > 3; });

    var hitProjects = activeProjects().filter(function (p) { return words.some(function (w) { return p.name.toLowerCase().indexOf(w) > -1; }); });
    if (hitProjects.length && !hitTasks.length) return { title: hitProjects[0].name.toUpperCase(), lead: hitProjects[0].statusReason, ids: openTasksOf(hitProjects[0].id).map(function (tk) { return tk.id; }) };
    return { title: hitTasks.length ? 'WHAT I FOUND' : 'NOTHING MATCHED', lead: hitTasks.length ? titleCase(count(hitTasks.length, 'task looks', 'tasks look')) + ' like what you asked about.' : 'Try a project name, a date, or a word from the task itself.', ids: hitTasks.map(function (tk) { return tk.id; }) };
  }

      S.draft = (base ? base + ' ' : '') + t;
      render();
    };
    rec.onerror = function () { stopMic(); };
    rec.onend = function () { S.listening = false; render(); };
    try { rec.start(); S.listening = true; render(); } catch (e) { toast('Couldn’t start the microphone.'); }
  }
  function stopMic() { if (rec) { try { rec.stop(); } catch (e) {} rec = null; } S.listening = false; render(); }

  // ---------------------------------------------------------------- render
  function render() {
    var root = document.getElementById('root');
    root.innerHTML = (S.onboarded || S.screen === 'welcome' || ONBOARD_SCREENS.indexOf(S.screen) === -1 ? '' : '') +
      (SCREENS[S.screen] ? SCREENS[S.screen]() : SCREENS.dashboard());
    var searchIn = document.getElementById('search-in');
    if (searchIn) searchIn.focus();
    var focusIds = ['task-title-in', 'onboard-say-in', 'capture-in', 'manual-project-in', 'custom-area-in'];
  }
  var ONBOARD_SCREENS = ['welcome', 'how-it-works', 'choose-areas', 'add-projects', 'onboard-capture', 'project-setup'];

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var v = el.getAttribute('data-v');
    if (act === 'close-sheet' && e.target !== el) return;
    // Capture whatever's currently typed before anything re-renders and
    // replaces the inputs underneath it — otherwise opening a sheet from a
    // half-filled form silently drops what was typed.
    syncFields();
    if (ACTS[act]) ACTS[act](v, el);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'search-in') { S.search = e.target.value; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'manual-project-in') { e.preventDefault(); ACTS['add-manual-project'](); }
    if (e.key === 'Enter' && e.target.id === 'custom-area-in') { e.preventDefault(); ACTS['add-area'](); }
  });

  // ---------------------------------------------------------------- boot
  function boot() {
    var web = location.protocol === 'http:' || location.protocol === 'https:';
    var probe = web
      ? fetch('/api/health', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }, function () { return null; })
      : Promise.resolve(null);
    probe.then(function (h) {
      if (h && h.trackerApp) { API = location.origin; return loadFromApi(); }
      try { absorbLocal(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) {}
      return null;
    }).then(function () {
      if (S.onboarded) { S.screen = 'dashboard'; }
      render();
    }, function () { render(); });
  }
  boot();
})();
</script>
