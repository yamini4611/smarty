<title>Smart Life Tracker</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap">
<style>
  :root {
    --ground: #f6f1e8;
    --paper: #fffdf9;
    --card: #ffffff;
    --ink: #3a332b;
    --dim: #7a7064;
    --faint: #ab9f8e;
    --accent: #6e9075;
    --accent-deep: #56745c;
    --accent-tint: #e8efe6;
    --overdue: #c1613f;
    --overdue-tint: #f7e7e0;
    --approaching: #c98a35;
    --approaching-tint: #f7ecd9;
    --pending: #8c8471;
    --pending-tint: #efeade;
    --done: #6e9075;
    --done-tint: #e8efe6;
    --pri-high: #c1613f;
    --pri-med: #b98a2e;
    --pri-low: #8c8471;
    --assistant: #8878b0;
    --assistant-deep: #6d5f94;
    --rule: #eee6d8;
    --rule-hard: #e6dbc7;
    --edge: #ddd0b8;
    --shadow: 0 2px 4px rgba(90, 74, 50, 0.05), 0 8px 20px rgba(90, 74, 50, 0.07);
    --shadow-sm: 0 1px 2px rgba(90, 74, 50, 0.06), 0 2px 8px rgba(90, 74, 50, 0.05);
    --display: 'Quicksand', 'Nunito', system-ui, sans-serif;
    --sans: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: #ece3d2; color: var(--ink); font-family: var(--sans); font-size: 14.5px; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, textarea { font: inherit; color: inherit; }

  #phone { height: 100%; max-width: 430px; margin: 0 auto; background: var(--ground); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #root { display: contents; }
  @media (min-width: 460px) { body { padding-block: 20px; } #phone { height: min(100%, 880px); border: 1px solid var(--edge); border-radius: 18px; } }

  .head { flex: none; padding: 22px 20px 0; background: var(--ground); }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 16px; }
  .wordmark { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 20px; background: var(--ground); }
  .scroll.pad-bottom { padding-bottom: 96px; }
  .paper-scroll { background: var(--paper); }

  .label { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--faint); text-transform: uppercase; }
  .sec { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 0 9px; }
  .display { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  .lede { font-size: 14px; line-height: 1.6; color: var(--dim); }

  .btn { display: block; width: 100%; text-align: center; padding: 15px 20px; font-size: 14.5px; font-weight: 700; border-radius: 16px; }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-primary:active { background: var(--accent-deep); }
  .btn-outline { border: 1.5px solid var(--edge); background: var(--paper); }
  .btn-quiet { color: var(--accent); font-size: 13.5px; padding: 11px 20px; font-weight: 700; }
  .btn-danger { color: var(--overdue); }
  .btn[disabled] { color: var(--faint); background: var(--paper); border: 1.5px solid var(--edge); cursor: default; box-shadow: none; }
  .foot { flex: none; padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; background: var(--paper); border-top: 1px solid var(--rule-hard); }

  /* Task rows — soft circular checkbox, title, meta line, colored due text */
  .task { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); width: 100%; }
  .task:active { background: rgba(110,144,117,0.06); }
  .checkbox { flex: none; width: 21px; height: 21px; border-radius: 50%; border: 1.8px solid var(--edge); background: var(--paper); display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .checkbox[aria-checked="true"] { background: var(--done); border-color: var(--done); }
  .flag { flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .task-title.done { text-decoration: line-through; color: var(--faint); font-weight: 500; }
  .task-meta { display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 11.5px; color: var(--faint); }
  .task-meta .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .due-chip { flex: none; font-size: 11.5px; font-weight: 700; padding-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .due-chip.overdue { color: var(--overdue); }
  .due-chip.approaching { color: var(--approaching); }
  .due-chip.pending { color: var(--faint); }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 10px 4px 8px; border-radius: 20px; }
  .pill.overdue { background: var(--overdue-tint); color: var(--overdue); }
  .pill.approaching { background: var(--approaching-tint); color: var(--approaching); }
  .pill.pending { background: var(--pending-tint); color: var(--pending); }
  .pill.done { background: var(--done-tint); color: var(--done); }

  /* Segment cards — big, rounded, soft-shadowed boxes, per the client's own direction */
  .segcard { display: block; width: 100%; background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 18px 19px; margin-top: 14px; }
  .segcard:first-child { margin-top: 4px; }
  .segcard:active { box-shadow: var(--shadow-sm); }
  .segcard-head { display: flex; align-items: flex-start; gap: 12px; }
  .segcard-icon { flex: none; width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .segcard-name { font-family: var(--display); font-size: 16.5px; font-weight: 700; }
  .segcard-desc { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin-top: 3px; }
  .segcard-badge { flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; }
  .segcard-counts { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .segcard-count { font-size: 12px; font-weight: 700; }
  .segcard-count .n { font-variant-numeric: tabular-nums; }
  .segcard-calm { font-size: 12.5px; color: var(--done); font-weight: 700; margin-top: 14px; }
  .segcard-tasks { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .segcard-task { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .segcard-task-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .segcard-task-title.done { text-decoration: line-through; color: var(--faint); font-weight: 500; }
  .segcard-task-pri { flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
  .segcard-more { font-size: 11.5px; color: var(--faint); font-weight: 600; }
  .segcard-empty { font-size: 12.5px; color: var(--faint); font-style: italic; }

  /* The dashboard as a canvas — segments as small colored tiles in a grid,
     not one long column. Each tile carries its own segment color, and
     priority reads as a color, not a label. */
  .canvas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 6px; }
  .seg-tile { position: relative; display: flex; flex-direction: column; text-align: left; border-radius: 20px; padding: 14px 14px 15px; box-shadow: var(--shadow-sm); min-height: 150px; }
  .seg-tile:active { box-shadow: none; transform: translateY(1px); }
  .seg-tile-icon { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
  .seg-tile-name { font-family: var(--display); font-size: 14.5px; font-weight: 700; margin-top: 9px; line-height: 1.25; }
  .seg-tile-badge { display: inline-block; margin-top: 3px; font-size: 8.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; background: rgba(255,255,255,0.55); }
  .seg-tile-alert { position: absolute; top: 12px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--overdue); box-shadow: 0 0 0 2px rgba(255,255,255,0.7); }
  .seg-tile-tasks { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .seg-tile-task { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .seg-tile-task-title { font-size: 11.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg-tile-empty { font-size: 11px; color: var(--dim); font-style: italic; margin-top: 10px; }
  .seg-tile-more { font-size: 10.5px; color: var(--dim); font-weight: 700; margin-top: 1px; }
  .pri-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .seg-tile-add { align-items: center; justify-content: center; gap: 6px; background: transparent; border: 1.5px dashed var(--edge); box-shadow: none; color: var(--accent); font-size: 12.5px; font-weight: 700; }
  .seg-tile-add:active { background: var(--paper); }

  /* Simple rows — used in sheets and onboarding lists, not the dashboard's own cards */
  .segrow { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); width: 100%; }
  .segrow:active { background: rgba(110,144,117,0.06); }
  .segdot { flex: none; width: 11px; height: 11px; border-radius: 50%; }
  .seg-counts { display: flex; gap: 12px; margin-top: 4px; }
  .seg-count { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .chiprow { display: flex; gap: 7px; overflow-x: auto; padding: 4px 20px 14px; flex: none; scrollbar-width: none; background: var(--ground); }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1.5px solid var(--edge); background: var(--paper); padding: 7px 13px; font-size: 12.5px; font-weight: 700; color: var(--dim); border-radius: 20px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .stats { display: flex; gap: 0; margin-top: 2px; }
  .tile { flex: 1; padding: 12px 4px 12px 0; }
  .tile .n { font-family: var(--display); font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .tile .label { margin-top: 5px; }

  .check-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--rule); width: 100%; }
  .check { flex: none; width: 19px; height: 19px; border-radius: 6px; border: 1.8px solid var(--edge); background: var(--paper); display: flex; align-items: center; justify-content: center; }
  .check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .toggle { flex: none; width: 40px; height: 23px; border-radius: 20px; border: 1px solid var(--edge); background: var(--paper); position: relative; }
  .toggle i { position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #d8cdb9; }
  .toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .toggle[aria-checked="true"] i { left: auto; right: 2px; background: #fff; }
  .field { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--rule); width: 100%; }
  .field-k { flex: none; width: 96px; font-size: 12px; font-weight: 700; color: var(--faint); }
  .field-v { flex: 1; font-size: 14.5px; font-weight: 600; }
  .field-v.empty { color: var(--faint); font-weight: 400; }
  .quote { font-size: 16px; font-weight: 500; line-height: 1.55; padding-left: 12px; border-left: 3px solid var(--accent); }
  .empty-note { font-size: 13px; color: var(--faint); line-height: 1.6; padding: 16px 0; }

  .sheet-wrap { position: absolute; inset: 0; background: rgba(58,51,43,0.28); display: flex; align-items: flex-end; z-index: 20; }
  .sheet { width: 100%; background: var(--paper); max-height: 92%; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 28px rgba(58,51,43,0.16); }
  .toast { position: absolute; left: 20px; right: 20px; bottom: 96px; background: var(--ink); color: #fff; padding: 13px 16px; font-size: 13px; border-radius: 14px; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: var(--shadow); }
  .toast button { font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; color: #fff; text-transform: uppercase; }
  .rec-dot { width: 7px; height: 7px; background: var(--overdue); border-radius: 50%; }

  .type-in { width: 100%; border: none; background: transparent; font-size: 18px; font-weight: 500; line-height: 1.4; resize: none; outline: none; }
  .type-in::placeholder { color: var(--faint); }
  .note-in { width: 100%; border: 1.5px solid var(--edge); border-radius: 14px; background: var(--paper); padding: 12px 14px; font-size: 13.5px; line-height: 1.55; resize: none; outline: none; min-height: 68px; }
  .note-in:focus { border-color: var(--accent); }
  .text-in { width: 100%; border: none; border-bottom: 1.5px solid var(--edge); background: transparent; padding: 8px 0; font-size: 15px; outline: none; }
  .text-in:focus { border-color: var(--accent); }

  .stepper { display: flex; gap: 4px; margin-top: 4px; }
  .stepper i { flex: 1; height: 4px; border-radius: 3px; background: var(--rule-hard); }
  .stepper i.on { background: var(--accent); }

  .pillrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .opt { border: 1.5px solid var(--edge); border-radius: 20px; background: var(--paper); padding: 9px 15px; font-size: 13px; font-weight: 600; color: var(--dim); }
  .opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .opt.pri-high[aria-pressed="true"] { background: var(--overdue); border-color: var(--overdue); }

  .track { height: 7px; border-radius: 5px; background: var(--rule-hard); margin-top: 8px; overflow: hidden; display: flex; }
  .track i { display: block; height: 100%; }

  .example-frame { border: 1.5px solid var(--rule-hard); border-radius: 18px; padding: 4px 14px; margin-top: 16px; background: var(--paper); }
  .followup { background: var(--accent-tint); border-radius: 14px; padding: 13px 15px; margin-top: 12px; font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .followup .opts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .box { background: var(--accent-tint); border-radius: 16px; padding: 14px 16px; }
  .fab { position: absolute; right: 18px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 27px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(110,144,117,0.45); z-index: 10; }
  .fab:active { background: var(--accent-deep); }
  .fab-guide { position: absolute; right: 84px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 27px; background: var(--assistant); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(136,120,176,0.45); z-index: 10; }
  .fab-guide:active { background: var(--assistant-deep); }

  /* The guide screen — a lightweight chat with the assistant, one question
     at a time, rather than a form dumped on you all at once. */
  .guide-msg { display: flex; gap: 10px; margin-top: 16px; align-items: flex-start; }
  .guide-avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--assistant); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .guide-bubble { background: var(--card); border-radius: 4px 16px 16px 16px; padding: 12px 15px; box-shadow: var(--shadow-sm); font-size: 14px; line-height: 1.5; max-width: 84%; }
  .guide-you { display: flex; justify-content: flex-end; margin-top: 12px; }
  .guide-you-bubble { background: var(--accent); color: #fff; border-radius: 16px 4px 16px 16px; padding: 10px 15px; font-size: 13.5px; max-width: 84%; }

  .nav { flex: none; background: var(--paper); border-top: 1px solid var(--rule-hard); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 4px 10px; }
  .nav .navlabel { font-size: 10px; font-weight: 700; color: var(--faint); }
  .nav button[aria-current="page"] .navlabel { color: var(--accent); }
  .avatar { width: 27px; height: 27px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none; }

  /* The turtle — a temporary project's own start-to-finish path */
  .turtle-wrap { margin-top: 16px; }
  .turtle-track { position: relative; height: 34px; margin-top: 6px; }
  .turtle-path { position: absolute; left: 15px; right: 15px; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 2px; background-image: linear-gradient(to right, var(--edge) 0 6px, transparent 6px 12px); background-size: 12px 3px; background-repeat: repeat-x; }
  .turtle-post { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; margin-top: -4.5px; background: var(--edge); }
  .turtle-post.start { left: 11px; }
  .turtle-post.finish { right: 11px; background: var(--accent); }
  .turtle-icon { position: absolute; top: 50%; transform: translate(-50%, -60%); font-size: 26px; line-height: 1; transition: left 0.5s cubic-bezier(.34,1.4,.64,1); filter: drop-shadow(0 1px 1px rgba(58,51,43,0.15)); }
  .turtle-caption { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; color: var(--faint); letter-spacing: 0.03em; text-transform: uppercase; margin-top: 2px; gap: 6px; }
  .turtle-caption span:last-child { text-align: right; }
  .turtle-eta { font-size: 11.5px; color: var(--dim); margin-top: 2px; font-weight: 600; }
  .turtle-wrap.mini { margin-top: 8px; }
  .turtle-wrap.mini .turtle-track { height: 20px; margin-top: 2px; }
  .turtle-wrap.mini .turtle-path { left: 8px; right: 8px; }
  .turtle-wrap.mini .turtle-post { width: 6px; height: 6px; }
  .turtle-wrap.mini .turtle-post.start { left: 5px; }
  .turtle-wrap.mini .turtle-post.finish { right: 5px; }
  .turtle-wrap.mini .turtle-icon { font-size: 15px; }
  .turtle-wrap.mini .turtle-pct { font-size: 10.5px; font-weight: 700; color: var(--dim); margin-top: 1px; }
</style>
<div id="phone"><div id="root"></div></div>
<script>
(function () {
  'use strict';
  var TODAY = new Date();
  var DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WORDS = ['no','one','two','three','four','five','six','seven','eight','nine'];

  function d0(y, m, day) { return new Date(y, m, day); }
  function startOfDay(dt) { return d0(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
  function daysFrom(iso) { if (!iso) return null; var dt = new Date(iso + 'T00:00:00'); return Math.round((startOfDay(dt) - startOfDay(TODAY)) / 86400000); }
  function monDate(dt) { return dt.getDate() + ' ' + MON[dt.getMonth()]; }
  function longDate(dt) { return DAYS_FULL[dt.getDay()] + ', ' + dt.getDate() + ' ' + MON[dt.getMonth()]; }
  // "HH:MM" (the native <input type="time"> format) -> "2:00 PM", for
  // display only — a task's due_time is optional and never drives the
  // overdue/approaching/pending bucketing, which stays date-only.
  function timeLabel(hhmm) {
    if (!hhmm) return '';
    var parts = hhmm.split(':'), h = +parts[0], m = parts[1];
    var ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + m + ' ' + ap;
  }
  function isoOf(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
  function dueChip(iso) {
    if (!iso) return { text: 'No date', cls: 'pending' };
    var n = daysFrom(iso);
    if (n < 0) return { text: n === -1 ? 'Yesterday' : Math.abs(n) + 'd overdue', cls: 'overdue' };
    if (n === 0) return { text: 'Today', cls: 'approaching' };
    if (n === 1) return { text: 'Tomorrow', cls: 'approaching' };
    if (n <= 7) return { text: DAYS[new Date(iso + 'T00:00:00').getDay()], cls: 'approaching' };
    return { text: monDate(new Date(iso + 'T00:00:00')), cls: 'pending' };
  }
  function count(n, sing, plur) { return (n < 10 ? WORDS[n] : n) + ' ' + (n === 1 ? sing : plur); }
  function titleCase(s) { s = (s || '').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var STATE_COLOR = { overdue: 'var(--overdue)', approaching: 'var(--approaching)', pending: 'var(--pending)', completed: 'var(--done)' };

  // ---------------------------------------------------------------- sheets
  var SHEETS = {};
  SHEETS['pick-segment'] = function () {
    return '<div class="head" style="padding:16px 20px 0;border-bottom:none"><div class="label">CHOOSE A SEGMENT</div></div>' +
      '<div class="scroll pad-bottom" style="margin-top:6px">' +
        activeSegments().map(function (s) {
          return '<button class="segrow" data-act="set-draft-segment" data-v="' + s.id + '">' + dot(s.color) + '<span class="task-title">' + esc(s.name) + '</span></button>';
        }).join('') +
        '<button class="segrow" data-act="new-segment-from-task" style="color:var(--accent)">' + svg(IC.plus, 15, 'var(--accent)') + '<span class="task-title" style="color:var(--accent)">New segment…</span></button>' +
      '</div>';
  };
  SHEETS['pick-date'] = function () {
    var d = S.draft;
    var opts = [['Today', isoOf(TODAY)], ['Tomorrow', isoOf(new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() + 1))], ['In a week', isoOf(new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() + 7))]];
    return '<div class="head" style="padding:16px 20px 0;border-bottom:none"><div class="label">DEADLINE</div></div>' +
      '<div class="scroll pad-bottom" style="margin-top:6px">' +
        opts.map(function (o) { return '<button class="segrow" data-act="set-draft-date" data-v="' + o[1] + '"><span class="task-title" style="flex:1">' + o[0] + '</span><span class="due-chip pending">' + dueChip(o[1]).text + '</span></button>'; }).join('') +
        '<div class="segrow"><span class="task-title" style="flex:1">Pick a date</span><input type="date" id="exact-date-in" class="text-in" style="width:150px;border-bottom:none" value="' + (d.due_at || '') + '"></div>' +
        '<div class="segrow"><span class="task-title" style="flex:1">Time <span class="task-meta" style="text-transform:none;letter-spacing:0">(optional)</span></span><input type="time" id="exact-time-in" class="text-in" style="width:110px;border-bottom:none" value="' + (d.due_time || '') + '"></div>' +
        '<button class="segrow" data-act="apply-exact-date" style="color:var(--accent)"><span class="task-title" style="color:var(--accent)">Use this date</span></button>' +
        '<button class="segrow" data-act="set-draft-date" data-v="none" style="color:var(--dim)"><span class="task-title">No deadline</span></button>' +
      '</div>';
  };
  SHEETS['pick-reminder'] = function () {
    var opts = [['none', 'No reminder'], ['at_deadline', 'At the deadline'], ['before', '1 day before, 9:00'], ['repeat', 'Repeats weekly']];
    return '<div class="head" style="padding:16px 20px 0;border-bottom:none"><div class="label">REMINDER</div></div>' +
      '<div class="scroll pad-bottom" style="margin-top:6px">' +
        opts.map(function (o) { return '<button class="segrow" data-act="set-draft-reminder" data-v="' + o[0] + '"><span class="task-title">' + o[1] + '</span></button>'; }).join('') +
      '</div>';
  };
  SHEETS['segment-menu'] = function () {
    var s = segmentById(S.sheetV);
    if (!s) return '';
    return '<div class="head" style="padding:16px 20px 0;border-bottom:none"><div class="label">' + esc(s.name).toUpperCase() + '</div></div>' +
      '<div class="scroll pad-bottom" style="margin-top:6px">' +
        '<button class="segrow" data-act="rename-segment-prompt" data-v="' + s.id + '"><span class="task-title">Rename</span></button>' +
        '<button class="segrow" data-act="redescribe-segment" data-v="' + s.id + '"><span class="task-title">Edit description</span></button>' +
        '<button class="segrow" data-act="recolor-segment" data-v="' + s.id + '"><span class="task-title">Change color</span></button>' +
        '<button class="segrow" data-act="open-sheet" data-v="segment-kind" data-sv="' + s.id + '"><span class="task-title">Change kind — currently ' + (KIND_META[kindOf(s)].label || 'Permanent') + '</span></button>' +
        (kindOf(s) === 'project' ? '<button class="segrow" data-act="redate-segment" data-v="' + s.id + '"><span class="task-title">Edit estimated finish</span></button>' : '') +
        (s.status === 'hidden'
          ? '<button class="segrow" data-act="show-segment" data-v="' + s.id + '"><span class="task-title">Unhide</span></button>'
          : '<button class="segrow" data-act="hide-segment" data-v="' + s.id + '"><span class="task-title">Hide from dashboard</span></button>') +
        (s.status === 'archived'
          ? '<button class="segrow" data-act="restore-segment" data-v="' + s.id + '"><span class="task-title">Restore</span></button>'
          : '<button class="segrow" data-act="archive-segment" data-v="' + s.id + '"><span class="task-title">Archive</span></button>') +
        '<button class="segrow" data-act="delete-segment" data-v="' + s.id + '"><span class="task-title" style="color:var(--overdue)">Delete permanently</span></button>' +
      '</div>';
  };
  SHEETS['segment-kind'] = function () {
    var s = segmentById(S.sheetV);
    if (!s) return '';
    var current = kindOf(s);
    return '<div class="head" style="padding:16px 20px 0;border-bottom:none"><div class="label">WHAT KIND OF SEGMENT IS THIS?</div></div>' +
      '<div class="scroll pad-bottom" style="margin-top:6px">' +
        ['permanent', 'routine', 'project'].map(function (k) {
          var m = KIND_META[k];
          return '<button class="segrow" style="align-items:flex-start" data-act="set-segment-kind" data-v="' + k + '" data-sv="' + s.id + '">' +
            '<div style="flex:1"><div class="task-title">' + (m.label || 'Permanent') + (k === current ? ' ✓' : '') + '</div>' +
            '<div class="segcard-desc" style="margin-top:2px">' + m.blurb + '</div></div>' +
          '</button>';
        }).join('') +
      '</div>';
  };
  SHEETS['global-reminder'] = function () {
    var opts = [['none', 'No reminder'], ['at_deadline', 'At the deadline'], ['before', '1 day before, 9:00'], ['repeat', 'Repeats weekly']];
    return '<div class="head" style="padding:16px 20px 0;border-bottom:none"><div class="label">DEFAULT REMINDER</div></div>' +
      '<div class="scroll pad-bottom" style="margin-top:6px">' +
        opts.map(function (o) { return '<button class="segrow" data-act="set-global-reminder" data-v="' + o[0] + '"><span class="task-title">' + o[1] + '</span></button>'; }).join('') +
      '</div>';
  };
  SHEETS['export-data'] = function () {
    var jsonText = esc(JSON.stringify(snapshot(), null, 2));
    return '<div class="head" style="padding:16px 20px 0;border-bottom:none"><div class="label">YOUR DATA, AS JSON</div></div>' +
      '<div class="scroll pad-bottom" style="margin-top:6px">' +
        '<p class="lede" style="font-size:12.5px">Everything below is yours. Select it and copy — there’s nothing else to set up.</p>' +
        '<pre style="white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11px;line-height:1.5;background:#fff;border:1px solid var(--rule-hard);border-radius:8px;padding:12px 14px;margin-top:10px;max-height:340px;overflow:auto;user-select:text">' + jsonText + '</pre>' +
      '</div>';
  };

  function sheetOverlay() {
    if (!S.sheet) return '';
    return '<div class="sheet-wrap" data-act="close-sheet"><div class="sheet" style="max-height:74%">' +
      (SHEETS[S.sheet] ? SHEETS[S.sheet]() : '') + '</div></div>';
  }
  function toastHtml() {
    if (!S.toast) return '';
    return '<div class="toast"><span>' + esc(S.toast) + '</span><button data-act="dismiss-toast">DISMISS</button></div>';
  }
  function tile(n, label, color) {
    return '<div class="tile"><div class="n" style="' + (color ? 'color:' + color : '') + '">' + n + '</div><div class="label">' + label + '</div></div>';
  }

  SCREENS.dashboard = function () {
    var d = dashboardData();
    var name = S.user.display_name ? S.user.display_name.split(' ')[0] : '';
    var hour = TODAY.getHours();
    var greet = (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening') + (name ? ', ' + esc(name) : '');
    // Every segment stays on screen regardless of filter — the boxes are the
    // stable anchor of the dashboard. A filter only narrows which tasks show
    // inside each one, so nothing you're tracking ever seems to vanish.
    var shown = d.segments;

    return '<div class="head">' +
        '<div class="head-row">' +
          '<div><div class="label">' + longDate(TODAY).toUpperCase().replace(',', ' ·') + '</div><div class="display" style="font-size:19px;margin-top:3px">' + greet + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:12px">' +
            '<button data-act="go" data-v="search">' + svg(IC.search, 19, 'var(--ink)') + '</button>' +
            '<button data-act="tab" data-v="settings" style="position:relative">' + svg(IC.bell, 19, 'var(--ink)') +
              (!S.notifPermission ? '<span style="position:absolute;top:-2px;right:-2px;width:7px;height:7px;background:var(--overdue);border-radius:50%"></span>' : '') + '</button>' +
            '<button data-act="tab" data-v="settings" class="avatar">' + (name ? esc(name.charAt(0).toUpperCase()) : svg(IC.gear, 12, '#fff', 2)) + '</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div style="padding:0 20px;background:var(--ground)">' +
        '<div class="stats" style="background:var(--card);border-radius:20px;box-shadow:var(--shadow-sm);padding:14px 16px 12px">' +
          tile(d.summary.overdue, 'OVERDUE', d.summary.overdue ? 'var(--overdue)' : null) +
          tile(d.summary.approaching, 'APPROACHING', d.summary.approaching ? 'var(--approaching)' : null) +
          tile(d.summary.pending, 'PENDING') +
          tile(d.summary.completedThisWeek, 'DONE THIS WK', d.summary.completedThisWeek ? 'var(--done)' : null) +
        '</div>' +
      '</div>' +
      '<div class="chiprow">' +
        ['all', 'overdue', 'approaching', 'pending', 'completed'].map(function (f) {
          return '<button class="chip" aria-pressed="' + (S.filter === f) + '" data-act="filter" data-v="' + f + '">' + titleCase(f) + '</button>';
        }).join('') +
      '</div>' +
      '<div class="scroll pad-bottom">' +
        '<div class="canvas-grid">' +
          shown.map(function (s) { return segTile(s, S.filter); }).join('') +
          '<button class="seg-tile seg-tile-add" data-act="new-segment-quick">' + svg(IC.plus, 22, 'var(--accent)', 2.2) + '<span>Add segment</span></button>' +
        '</div>' +
      '</div>' +
      '<button class="fab-guide" data-act="go" data-v="voice-guide" aria-label="Ask the assistant to add something">' + svg(IC.mic, 21, '#fff', 2) + '</button>' +
      '<button class="fab" data-act="go" data-v="add-task" aria-label="Add task">' + svg(IC.plus, 22, '#fff', 2.2) + '</button>' +
      navBar() + sheetOverlay() + toastHtml();
  };

  SCREENS.upcoming = function () {
    var rows = allOpenSorted().filter(function (t) { return taskState(t) === 'overdue' || taskState(t) === 'approaching' || taskState(t) === 'pending'; });
    var overdue = rows.filter(function (t) { return taskState(t) === 'overdue'; });
    var approaching = rows.filter(function (t) { return taskState(t) === 'approaching'; });
    var pending = rows.filter(function (t) { return taskState(t) === 'pending'; });
    return '<div class="head"><div class="head-row"><div class="wordmark">Upcoming</div></div></div>' +
      '<div class="scroll pad-bottom">' +
        (overdue.length ? sectionHead('OVERDUE', overdue.length) + overdue.map(function (t) { return taskRow(t); }).join('') : '') +
        (approaching.length ? sectionHead('APPROACHING', approaching.length) + approaching.map(function (t) { return taskRow(t); }).join('') : '') +
        (pending.length ? sectionHead('PENDING', pending.length) + pending.map(function (t) { return taskRow(t); }).join('') : '') +
        (!rows.length ? '<p class="empty-note">Nothing open. You’re fully caught up.</p>' : '') +
      '</div>' +
      '<button class="fab" data-act="go" data-v="add-task">' + svg(IC.plus, 22, '#fff', 2.2) + '</button>' +
      navBar() + sheetOverlay() + toastHtml();
  };

  SCREENS.completed = function () {
    var done = S.tasks.filter(function (t) { return t.status === 'completed'; }).sort(function (a, b) { return new Date(b.completed_at || 0) - new Date(a.completed_at || 0); });
    var thisWeek = done.filter(function (t) { return t.completed_at && daysFrom(t.completed_at.slice(0, 10)) >= -7; });
    var earlier = done.filter(function (t) { return !(t.completed_at && daysFrom(t.completed_at.slice(0, 10)) >= -7); });
    return '<div class="head"><div class="head-row"><div class="wordmark">Completed</div></div></div>' +
      '<div class="scroll pad-bottom">' +
        sectionHead('THIS WEEK', thisWeek.length) +
        (thisWeek.length ? thisWeek.map(function (t) { return taskRow(t, { checkable: false }); }).join('') : '<p class="empty-note">Nothing completed yet this week.</p>') +
        (earlier.length ? sectionHead('EARLIER', earlier.length) + earlier.map(function (t) { return taskRow(t, { checkable: false }); }).join('') : '') +
      '</div>' +
      navBar() + sheetOverlay() + toastHtml();
  };

  SCREENS['segment-detail'] = function () {
    var s = segmentById(S.openSegmentId);
    if (!s) { go('dashboard'); return ''; }
    var ds = decorateSegment(s);
    var kind = kindOf(s);
    var meta = KIND_META[kind];
    var open = S.tasks.filter(function (t) { return t.segment_id === s.id && t.status === 'open'; }).sort(function (a, b) {
      var rank = { overdue: 0, approaching: 1, pending: 2 };
      return rank[taskState(a)] - rank[taskState(b)];
    });
    var done = S.tasks.filter(function (t) { return t.segment_id === s.id && t.status === 'completed'; });
    return backHeader(s.name, 'go', 'dashboard') +
      '<div class="scroll pad-bottom">' +
        // The hero card — icon, name, description, and (for a project) its
        // own start-to-finish path, exactly as it appears on the dashboard.
        '<div class="segcard" style="margin-top:4px;cursor:default">' +
          '<div class="segcard-head">' +
            '<div class="segcard-icon" style="background:' + segTint(s.color) + ';font-size:22px">' + segEmoji(s) + '</div>' +
            '<div style="flex:1;min-width:0">' +
              '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
                '<div class="segcard-name" style="font-size:18px">' + esc(s.name) + '</div>' +
                (meta.label ? '<span class="segcard-badge" style="background:' + meta.badgeBg + ';color:' + meta.badgeFg + '">' + meta.label + '</span>' : '') +
              '</div>' +
              (s.description ? '<div class="segcard-desc" style="font-size:13px">' + esc(s.description) + '</div>' : '<div class="segcard-desc" style="font-size:13px;font-style:italic">No description yet.</div>') +
            '</div>' +
            '<button data-act="open-sheet" data-v="segment-menu" data-sv="' + s.id + '" style="padding:4px;margin:-4px -4px 0 0">' + svg('M12 5h.01M12 12h.01M12 19h.01', 18, 'var(--faint)', 2.4) + '</button>' +
          '</div>' +
          (kind === 'project' ? turtleTrack(ds) : '') +
          '<div class="segcard-counts" style="margin-top:16px">' +
            (ds.overdue ? '<span class="segcard-count" style="color:var(--overdue)"><span class="n">' + ds.overdue + '</span> overdue</span>' : '') +
            (ds.approaching ? '<span class="segcard-count" style="color:var(--approaching)"><span class="n">' + ds.approaching + '</span> approaching</span>' : '') +
            (ds.pending ? '<span class="segcard-count" style="color:var(--pending)"><span class="n">' + ds.pending + '</span> pending</span>' : '') +
            '<span class="segcard-count" style="color:var(--done)"><span class="n">' + ds.completed + '</span> done</span>' +
          '</div>' +
        '</div>' +

        sectionHead('TASKS TO DO', open.length) +
        (open.length ? open.map(function (t) { return taskRow(t, { segment: false }); }).join('') : '<p class="empty-note">Nothing open here right now — add a task below whenever you’re ready.</p>') +

        (done.length ? sectionHead('PAST · DONE', done.length) + done.map(function (t) { return taskRow(t, { checkable: false, segment: false }); }).join('') : '') +
      '</div>' +
      '<div class="foot"><button class="btn btn-primary" data-act="go" data-v="add-task" data-segment="' + s.id + '">Add task to ' + esc(s.name) + '</button></div>' +
      sheetOverlay() + toastHtml();
  };

  SCREENS['new-segment'] = function () {
    var d = S.newSegment || { name: '', description: '', kind: 'permanent', target_date: null, color: SEG_PALETTE[S.segments.length % SEG_PALETTE.length] };
    S.newSegment = d;

    return backHeader('New segment', 'go', 'dashboard') +
      '<div class="scroll pad-bottom">' +
        '<input class="text-in" id="ns-name-in" placeholder="Segment name" value="' + esc(d.name) + '" style="font-size:17px;font-weight:600;margin-top:14px">' +
        sectionHead('WHAT’S THIS FOR?') +
        '<textarea class="note-in" id="ns-desc-in" placeholder="A line about it, so you remember why it’s here…" style="margin-top:6px">' + esc(d.description) + '</textarea>' +
        sectionHead('KIND') +
        '<div class="pillrow">' +
          '<button class="opt" aria-pressed="' + (kind === 'permanent') + '" data-act="set-newsegment-kind" data-v="permanent">Permanent</button>' +
          '<button class="opt" aria-pressed="' + (kind === 'routine') + '" data-act="set-newsegment-kind" data-v="routine">Routine</button>' +
          '<button class="opt" aria-pressed="' + (kind === 'project') + '" data-act="set-newsegment-kind" data-v="project">Temporary project</button>' +
        '</div>' +
        '<p class="lede" style="font-size:12px;margin-top:8px">' + KIND_META[kind].blurb + '</p>' +
        (kind === 'project' ? (

          '<input type="date" id="ns-target-in" class="text-in" value="' + (d.target_date || '') + '" style="margin-top:4px">' +
          '<p class="lede" style="font-size:12px;margin-top:6px">The turtle still moves by tasks completed — this just marks where you’re aiming.</p>'
        ) : '') +
        sectionHead('COLOR') +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">' + SEG_PALETTE.map(function (c) {
          return '<button data-act="set-newsegment-color" data-v="' + c + '" style="width:32px;height:32px;border-radius:50%;background:' + c + ';border:2.5px solid ' + (d.color === c ? 'var(--ink)' : 'transparent') + '"></button>';
        }).join('') + '</div>' +
      '</div>' +
      '<div class="foot"><button class="btn btn-primary" data-act="save-new-segment"' + (!d.name.trim() ? ' disabled' : '') + '>Create segment</button></div>';
  };

  SCREENS.search = function () {
    var q = (S.search || '').toLowerCase();
    var tasks = q ? S.tasks.filter(function (t) { return t.title.toLowerCase().indexOf(q) > -1 || (t.notes || '').toLowerCase().indexOf(q) > -1; }) : [];
    return backHeader('Search', 'go', 'dashboard') +
      '<div style="padding:14px 20px 0;background:var(--paper)"><input class="text-in" id="search-in" placeholder="Search your tasks…" value="' + esc(S.search) + '" style="font-size:16px"></div>' +
      '<div class="scroll pad-bottom" style="margin-top:6px">' +
        (!q ? '<p class="empty-note">Start typing to search titles and notes.</p>' : (
          tasks.length ? tasks.map(function (t) { return taskRow(t); }).join('') : '<p class="empty-note">Nothing matches "' + esc(S.search) + '".</p>'
        )) +
      '</div>';
  };

  SCREENS.settings = function () {
    return '<div class="head"><div class="head-row"><div class="wordmark">Settings</div></div></div>' +
      '<div class="scroll pad-bottom">' +
        '<div class="box" style="margin-top:4px;display:flex;align-items:center;gap:12px">' +
          '<div style="flex:1"><div class="task-title" style="font-size:13.5px">Trying out the app?</div>' +
          '<div class="task-meta" style="margin-top:3px;text-transform:none;letter-spacing:0">One tap wipes this run and puts you back at the welcome screen — for as many test runs as you want.</div></div>' +
          '<button class="btn btn-outline" data-act="reset-demo" style="width:auto;padding:9px 14px;font-size:12px;white-space:nowrap">Start over</button>' +
        '</div>' +
        sectionHead('PROFILE') +
        '<div class="field"><div class="field-k">NAME</div><div class="field-v">' + esc(S.user.display_name || '—') + '</div></div>' +
        '<div class="field"><div class="field-k">EMAIL</div><div class="field-v">' + esc(S.user.email || '—') + '</div></div>' +
        '<div class="field"><div class="field-k">AGE RANGE</div><button class="field-v' + (!S.ageRange ? ' empty' : '') + '" data-act="open-sheet" data-v="age-picker">' + (S.ageRange || 'Not set') + '</button></div>' +

        sectionHead('REMINDERS') +

  };

  SHEETS['age-picker'] = function () {
    return '<div class="head" style="padding:16px 20px 0;border-bottom:none"><div class="label">AGE RANGE</div></div>' +
      '<div class="scroll pad-bottom" style="margin-top:6px">' +
        AGE_RANGES.map(function (a) { return '<button class="segrow" data-act="set-age" data-v="' + esc(a) + '"><span class="task-title">' + a + '</span></button>'; }).join('') +
      '</div>';
  };

  // ---------------------------------------------------------------- local parser (fallback mode)
  // Mirrors backend/assistant.js so the demo behaves identically with or
  // without a server behind it.
  var WD = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  var REMINDER_PHRASE = /\bremind me\b|\breminder\b/i;
  var HIGH_PRIORITY = /\burgent\b|\basap\b|\bimmediately\b|\bcritical\b/i;
  var LOW_PRIORITY = /\bwhenever\b|\bno rush\b|\blow priority\b/i;

  function localResolveDate(t, today) {
    var add = function (n) { var x = new Date(today); x.setDate(x.getDate() + n); return x; };
    var m;
    if (/\btomorrow\b/.test(t)) return { date: add(1) };
    if (/\btoday\b|\btonight\b/.test(t)) return { date: add(0) };
    if ((m = t.match(/\bin (\d+) days?\b/))) return { date: add(parseInt(m[1], 10)) };
    if ((m = t.match(/\bnext (sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))) {
      var delta1 = (WD.indexOf(m[1]) - today.getDay() + 7) % 7; if (delta1 === 0) delta1 = 7; delta1 += 7;
      return { date: add(delta1) };
    }
    if ((m = t.match(/\b(?:on |by )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))) {
      var delta2 = (WD.indexOf(m[1]) - today.getDay() + 7) % 7; if (delta2 === 0) delta2 = 7;
      var near = add(delta2), following = add(delta2 + 7);
      return { date: near, ambiguous: true, question: 'Do you mean this ' + titleCase(m[1]) + ' (' + monDate(near) + '), or the ' + titleCase(m[1]) + ' after (' + monDate(following) + ')?', alt: following };
    }
    if ((m = t.match(/\b(?:on |by |the )(\d{1,2})(?:st|nd|rd|th)\b/))) {
      var day = parseInt(m[1], 10);
      var x = new Date(today.getFullYear(), today.getMonth(), day);
      if (x < today) x = new Date(today.getFullYear(), today.getMonth() + 1, day);
      return { date: x };
    }
    if (/\bnext week\b/.test(t)) return { date: add(7), ambiguous: true, question: 'Which day next week?' };
    if (/\bend of the month\b|\bthis month\b/.test(t)) return { date: new Date(today.getFullYear(), today.getMonth() + 1, 0), ambiguous: true, question: 'Which day this month?' };
    return {};
  }
  function localReminderFrom(clause) {
    if (!REMINDER_PHRASE.test(clause)) return null;
    return { mode: 'before', offsetDays: 1, atHour: 9, needsConfirm: true };
  }
  function localSplitClauses(text) {
    var parts = String(text).split(/\s+and (?:then )?(?=\w)|[;.]\s+|,\s+(?:and\s+)?(?:also|then)\s+/i).map(function (c) { return c.trim(); }).filter(function (c) { return c.length > 2; });
    var merged = [];
    parts.forEach(function (c) {
      if (/^remind me\b/i.test(c) && merged.length) merged[merged.length - 1] += ' and ' + c;
      else merged.push(c);
    });
    return (merged.length ? merged : [String(text)]).slice(0, 4);
  }
  function localCleanTitle(raw) {
    return raw.trim()
      .replace(/^(i need to|i have to|i must|i should|please|can you|remind me to|remember to|don'?t forget to|i want to)\s+/i, '')
      .replace(/^for (?:my |our |the )?[^,]{1,40},\s*/i, '')
      .replace(/,?\s*(?:and\s+)?remind me (?:the day before|of it|about it)\b.*/i, '')
      .replace(/\b(?:on |by )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/gi, '')
      .replace(/\b(tomorrow|today|tonight|next week|this month|end of the month)\b/gi, '')
      .replace(/\bin \d+ days?\b/gi, '')
      .replace(/\b(?:on |by |before )?the \d{1,2}(?:st|nd|rd|th)\b/gi, '')
      .replace(/,?\s*\b(?:urgent|asap|immediately|critical|whenever|no rush|low priority)\b\.?/gi, '')
      .replace(/\s{2,}/g, ' ').replace(/\s+([,.])/g, '$1').replace(/[,\s]+$/, '').trim();
  }
  function localMatchSegment(clause) {
    var t = clause.toLowerCase(), best = null, bestScore = 0;
    activeSegments().forEach(function (s) {
      var words = s.name.toLowerCase().split(/\W+/).filter(function (w) { return w.length > 3; });
      var score = words.filter(function (w) { return t.indexOf(w) > -1; }).length;
      if (score > bestScore) { bestScore = score; best = s; }
    });
    return bestScore > 0 ? best : null;
  }
  function localParseClause(raw, i) {
    var today = TODAY;
    var t = raw.toLowerCase();
    var when = localResolveDate(t, today);
    var seg = localMatchSegment(raw);
    var title = titleCase(localCleanTitle(raw)) || titleCase(raw.trim());
    var priority = 'normal';
    if (HIGH_PRIORITY.test(t)) priority = 'high'; else if (LOW_PRIORITY.test(t)) priority = 'low';
    return {
      id: 'p' + (i + 1), title: title, segmentId: seg ? seg.id : null, segmentName: seg ? seg.name : null,
      needsSegmentChoice: !seg, date: when.date ? isoOf(when.date) : null, dateAmbiguous: !!when.ambiguous,
      followUp: when.question || null, alt: when.alt ? isoOf(when.alt) : null, priority: priority, reminder: localReminderFrom(raw)
    };
  }
  function localParse(text) {
    return localSplitClauses(text).map(localParseClause);
  }
  // The onboarding "add first tasks" screen invites a plain list — "pay the
  // bill, book the dentist" — so it splits on bare commas too, not just the
  // clause-boundary punctuation a full sentence needs elsewhere.
  function localParseTaskList(text) {
    var parts = String(text).split(/\s*,\s*|\s+and\s+/i).map(function (c) { return c.trim(); }).filter(function (c) { return c.length > 2; });
    return (parts.length ? parts : [String(text)]).slice(0, 6).map(localParseClause);
  }
  function localAnswer(text) {
    var t = text.toLowerCase(), now = TODAY;
    var open = S.tasks.filter(function (tk) { return tk.status === 'open'; });
    var segName = function (id) { var s = segmentById(id); return s ? s.name : ''; };

    if (/how much did i complete|completed this week|what did i complete/.test(t)) {
      var done = S.tasks.filter(function (tk) { return tk.status === 'completed' && tk.completed_at && daysFrom(tk.completed_at.slice(0, 10)) >= -7; });
      return { title: 'COMPLETED THIS WEEK', lead: done.length ? titleCase(count(done.length, 'task', 'tasks')) + ' completed this week.' : 'Nothing completed yet this week.', ids: done.map(function (tk) { return tk.id; }) };
    }
    if (/what is overdue|what'?s overdue|overdue\b/.test(t)) {
      var late = open.filter(function (tk) { return taskState(tk) === 'overdue'; });
      return { title: 'OVERDUE', lead: late.length ? titleCase(count(late.length, 'task is', 'tasks are')) + ' overdue.' : 'Nothing is overdue.', ids: late.map(function (tk) { return tk.id; }) };
    }
    if (/due this week|this week|next few days|approaching/.test(t)) {
      var soon = open.filter(function (tk) { return taskState(tk) === 'approaching'; });
      return { title: 'DUE THIS WEEK', lead: soon.length ? titleCase(count(soon.length, 'task is', 'tasks are')) + ' approaching in the next seven days.' : 'Nothing is due in the next seven days.', ids: soon.map(function (tk) { return tk.id; }) };
    }
    if (/what should i do next|do next|what next/.test(t)) {
      var urgent = open.filter(function (tk) { return taskState(tk) === 'overdue' || taskState(tk) === 'approaching'; })
        .sort(function (a, b) { return daysFrom(a.due_at) - daysFrom(b.due_at); });
      if (urgent.length) { var tk = urgent[0]; return { title: 'DO NEXT', lead: '"' + tk.title + '" in ' + segName(tk.segment_id) + ' — ' + (taskState(tk) === 'overdue' ? 'overdue' : 'due soon') + '.', ids: [tk.id] }; }
      var byPri = open.filter(function (tk) { return taskState(tk) === 'pending'; }).sort(function (a, b) { return (b.priority === 'high') - (a.priority === 'high'); });
      if (byPri.length) return { title: 'DO NEXT', lead: '"' + byPri[0].title + '" in ' + segName(byPri[0].segment_id) + ' is your highest-priority open task.', ids: [byPri[0].id] };
      return { title: 'DO NEXT', lead: 'Nothing open right now — you’re caught up.', ids: [] };
    }
    var inMatch = t.match(/what do i have in ([a-z ]+)\??$/) || t.match(/\bin ([a-z ]+)\??$/);
    if (inMatch) {
      var needle = inMatch[1].trim();
      var seg = activeSegments().filter(function (s) { return s.name.toLowerCase().indexOf(needle) > -1; })[0];
      if (seg) {
        var rows = open.filter(function (tk) { return tk.segment_id === seg.id; });
        return { title: seg.name.toUpperCase(), lead: rows.length ? titleCase(count(rows.length, 'active task', 'active tasks')) + ' in ' + seg.name + '.' : 'Nothing active in ' + seg.name + '.', ids: rows.map(function (tk) { return tk.id; }) };
      }
    }
    var words = t.split(/\W+/).filter(function (w) { return w.length > 3; });
    var hits = open.filter(function (tk) { return words.some(function (w) { return tk.title.toLowerCase().indexOf(w) > -1 || (tk.notes || '').toLowerCase().indexOf(w) > -1; }); });
    return { title: hits.length ? 'WHAT I FOUND' : 'NOTHING MATCHED', lead: hits.length ? titleCase(count(hits.length, 'task looks', 'tasks look')) + ' like what you asked about.' : 'Try a segment name, a date, or a word from the task itself.', ids: hits.map(function (tk) { return tk.id; }) };
  }
  function isQuestion(t) { return /\?$/.test(t.trim()) || /^(what|when|how much|how many|which|where|show me|do i|is there|are there|who)\b/i.test(t.trim()); }

  // ---------------------------------------------------------------- sync raw inputs into state
  function val(id) { var el = document.getElementById(id); return el ? el.value : undefined; }
  function syncFields() {
    if (S.screen === 'add-task' && !S.captureFlow) {
      if (val('task-title-in') !== undefined) S.draft.title = val('task-title-in');
      if (val('task-notes-in') !== undefined) S.draft.notes = val('task-notes-in');
    }
    if (S.screen === 'about-you') {
      if (val('life-stage-other-in') !== undefined) S.lifeStageOther = val('life-stage-other-in');
      if (val('goal-other-in') !== undefined) S.goalOther = val('goal-other-in');
    }
    if (S.captureFlow === 'listen' && val('capture-in') !== undefined) S.draft = val('capture-in');
    if (S.screen === 'voice-guide' && val('guide-in') !== undefined) S.draft = val('guide-in');
    if (S.screen === 'onboard-capture' && val('onboard-say-in') !== undefined) S.draft = val('onboard-say-in');
    if (S.screen === 'choose-segments') {

      document.querySelectorAll('[data-act="rename-segment"]').forEach(function (el) {

    }
    if (S.screen === 'new-segment') {
      if (val('ns-name-in') !== undefined) S.newSegment.name = val('ns-name-in');
      if (val('ns-desc-in') !== undefined) S.newSegment.description = val('ns-desc-in');
    }
    if (S.sheet === 'pick-date') {

      if (val('exact-time-in') !== undefined) S._exactTime = val('exact-time-in');
    }
  }

  // ---------------------------------------------------------------- actions
  var ACTS = {
    'sign-in': function (v) {

      if (v !== 'returning') S.user.email = v === 'google' ? 'you@gmail.com' : 'you@icloud.com';

    'connect-calendar': function () {

      if (API) call('PUT', '/api/settings/calendar', { connect: true }).then(function (ig) { S.integration = ig; }).then(after);
      else { S.integration.status = 'connected'; after(); }
    },
    'set-age': function (v) { S.ageRange = v; closeSheet(); render(); },
    'toggle-stage': function (v) { var i = S.lifeStages.indexOf(v); if (i > -1) S.lifeStages.splice(i, 1); else S.lifeStages.push(v); render(); },

        if (gi > -1) { if (S.goalOther.trim()) S.goals[gi] = S.goalOther.trim(); else S.goals.splice(gi, 1); }

    'tab': function (v) { S.captureFlow = null; if (v === 'dashboard') S.openSegmentId = null; go(v); },

    'select-suggestion': function (v) {

    },
    'rename-segment': function () { /* live edit; synced on demand */ },
    'remove-segment': function (v) { S.chosenSegments.splice(+v, 1); render(); },
    'set-chosen-kind': function (v, el) { syncFields(); S.chosenSegments[+el.getAttribute('data-i')].kind = v; render(); },
    'add-custom-segment': function () {

    'commit-segments': function () {

    'mic': function () { toggleMic(); },

      if (!d.title.trim()) { toast('A task needs a title.'); return; }
      if (!d.segment_id) { toast('Choose a segment first.'); return; }
      var payload = { title: d.title.trim(), notes: d.notes, due_at: d.due_at, due_time: d.due_at ? d.due_time : null, priority: d.priority, segment_id: d.segment_id, reminder: d.reminder };
      var after = function () { toast(d.id ? 'Task updated.' : 'Task added.'); S.captureFlow = null; saveLocal(); go(S.openSegmentId ? 'segment-detail' : (S.tabBefore || 'dashboard')); };
      if (d.id) {
        if (API) call('PATCH', '/api/tasks/' + d.id, payload).then(function (t) { Object.assign(taskById(d.id), t); }).then(after);
        else { Object.assign(taskById(d.id), payload); after(); }
      } else {
        if (API) call('POST', '/api/tasks', Object.assign({ calendarExport: d.calendarExport }, payload)).then(function (t) { S.tasks.push(t); }).then(after);
        else { S.tasks.push(Object.assign({ id: newId('t'), status: 'open', calendar_event_id: d.calendarExport && d.due_at ? 'mock_' + newId('e') : null, completed_at: null, created_at: new Date().toISOString() }, payload)); after(); }
      }
    },
    'delete-task': function (v) {
      if (!confirm('Delete this task? This can’t be undone.')) return;
      var after = function () { S.tasks = S.tasks.filter(function (t) { return t.id !== v; }); saveLocal(); S.captureFlow = null; go(S.openSegmentId ? 'segment-detail' : (S.tabBefore || 'dashboard')); };
      if (API) call('DELETE', '/api/tasks/' + v).then(after); else after();
    },
    'open-task': function (v) {
      var t = taskById(v);
      S.draft = { id: t.id, segment_id: t.segment_id, title: t.title, notes: t.notes, due_at: t.due_at, due_time: t.due_time || null, noDeadlineChosen: !t.due_at, priority: t.priority, reminder: t.reminder, calendarExport: !!t.calendar_event_id };
      S.captureFlow = null;
      S.tabBefore = S.openSegmentId ? 'segment-detail' : S.screen;
      go('add-task');
    },
    'toggle-task': function (v) {
      var t = taskById(v);
      var done = t.status !== 'completed';
      var after = function () { toast(done ? 'Nice — marked done.' : 'Reopened.'); saveLocal(); render(); };
      if (API) call('POST', '/api/tasks/' + v + '/' + (done ? 'complete' : 'reopen'), {}).then(function (nt) { Object.assign(t, nt); }).then(after);
      else { t.status = done ? 'completed' : 'open'; t.completed_at = done ? new Date().toISOString() : null; after(); }
    },

    'filter': function (v) { S.filter = v; render(); },
    'open-segment': function (v) { S.openSegmentId = v; go('segment-detail'); },
    'dismiss-toast': function () { S.toast = null; render(); },
    'new-segment-quick': function () { S.newSegment = null; go('new-segment'); },
    'set-newsegment-color': function (v) { S.newSegment.color = v; render(); },
    'set-newsegment-kind': function (v) { syncFields(); S.newSegment.kind = v; render(); },
    'save-new-segment': function () {
      syncFields();
      var d = S.newSegment;
      if (!d.name.trim()) return;
      d.icon = inferIcon(d.name);
      var after = function (s) { toast('Segment created.'); saveLocal(); go('segment-detail', { openSegmentId: s.id }); };
      if (API) call('POST', '/api/segments', d).then(function (s) { S.segments.push(s); after(s); });
      else { var s = Object.assign({ id: newId('sg'), user_id: 'u1', sort_order: S.segments.length, status: 'active', archived_at: null, created_at: new Date().toISOString() }, d); S.segments.push(s); after(s); }
    },

    'rename-segment-prompt': function (v) {
      var s = segmentById(v);
      var name = prompt('Segment name:', s.name);
      if (name) { s.name = name; saveLocal(); closeSheet(); if (API) call('PATCH', '/api/segments/' + s.id, { name: name }); }
    },
    'recolor-segment': function (v) {
      var s = segmentById(v);
      var i = SEG_PALETTE.indexOf(s.color);
      s.color = SEG_PALETTE[(i + 1) % SEG_PALETTE.length];
      saveLocal(); closeSheet();
      if (API) call('PATCH', '/api/segments/' + s.id, { color: s.color });
    },
    'redescribe-segment': function (v) {
      var s = segmentById(v);
      var desc = prompt('What’s this segment for?', s.description || '');
      if (desc !== null) { s.description = desc; saveLocal(); closeSheet(); if (API) call('PATCH', '/api/segments/' + s.id, { description: desc }); }
    },
    'set-segment-kind': function (v, el) {
      var id = el.getAttribute('data-sv');
      var s = segmentById(id);
      s.kind = v;
      if (v !== 'project') s.target_date = null;
      saveLocal(); closeSheet();
      toast(v === 'project' ? 'Now a project, with its own path to finished.' : v === 'routine' ? 'Now a routine.' : 'Now a permanent segment.');
      if (API) call('PATCH', '/api/segments/' + s.id, { kind: v, target_date: s.target_date });
    },
    'redate-segment': function (v) {
      var s = segmentById(v);
      var d = prompt('Estimated finish (YYYY-MM-DD), or leave blank to clear:', s.target_date || '');
      if (d !== null) {
        s.target_date = d.trim() || null;
        saveLocal(); closeSheet();
        if (API) call('PATCH', '/api/segments/' + s.id, { target_date: s.target_date });
      }
    },
    'hide-segment': function (v) {
      var s = segmentById(v); s.status = 'hidden'; saveLocal(); closeSheet();
      if (API) call('POST', '/api/segments/' + v + '/hide', {});
    },
    'show-segment': function (v) {
      var s = segmentById(v); s.status = 'active'; saveLocal(); closeSheet();
      if (API) call('POST', '/api/segments/' + v + '/show', {});
    },
    'archive-segment': function (v) {
      var s = segmentById(v);
      var after = function () { toast('Archived.'); saveLocal(); closeSheet(); go('dashboard'); };
      if (API) call('POST', '/api/segments/' + v + '/archive', {}).then(function (ns) { Object.assign(s, ns); }).then(after);
      else { s.status = 'archived'; s.archived_at = new Date().toISOString(); after(); }
    },
    'restore-segment': function (v) {
      var s = segmentById(v);
      var after = function () { toast('Restored.'); saveLocal(); closeSheet(); };
      if (API) call('POST', '/api/segments/' + v + '/restore', {}).then(function (ns) { Object.assign(s, ns); }).then(after);
      else { s.status = 'active'; s.archived_at = null; after(); }
    },
    'delete-segment': function (v) {
      var s = segmentById(v);
      if (!confirm('Delete "' + s.name + '" and all its tasks? This can’t be undone.')) return;
      var after = function () { S.segments = S.segments.filter(function (x) { return x.id !== s.id; }); S.tasks = S.tasks.filter(function (t) { return t.segment_id !== s.id; }); saveLocal(); closeSheet(); go('dashboard'); };
      if (API) call('DELETE', '/api/segments/' + v).then(after); else after();
    },

    'grant-notif': function () { S.notifPermission = true; toast('Notifications enabled for this device.'); render(); },
    'toggle-voice-spoken': function () {
      S.settings.voiceSpoken = !S.settings.voiceSpoken;
      saveLocal(); render();
      if (API) call('PUT', '/api/settings/voice', { voiceSpoken: S.settings.voiceSpoken });
    },
    'toggle-private-mode': function () {
      S.settings.privateMode = !S.settings.privateMode;
      saveLocal(); render();
      if (API) call('PUT', '/api/settings/voice', { privateMode: S.settings.privateMode });
    },
    'toggle-calendar': function () {
      var connect = S.integration.status !== 'connected';
      var after = function () { toast(connect ? 'Connected — dated tasks can now export.' : 'Disconnected.'); saveLocal(); render(); };
      if (API) call('PUT', '/api/settings/calendar', { connect: connect }).then(function (ig) { S.integration = ig; }).then(after);
      else { S.integration.status = connect ? 'connected' : 'disconnected'; after(); }
    },
    'export-data': function () { openSheet('export-data'); },
    'sign-out': function () {
      if (!confirm('Sign out?')) return;
      var after = function () { S.onboarded = false; S.screen = 'welcome'; render(); };
      if (API) call('POST', '/api/auth/sign-out', {}).then(after); else after();
    },
    'confirm-delete-account': function () {
      if (!confirm('Delete your account and everything in it? This can’t be undone.')) return;
      var after = function () { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
      if (API) call('DELETE', '/api/account').then(after); else after();
    },
    'reset-demo': function () {
      // One tap, no confirm() — this screen exists so a tester can wipe and
      // re-run the whole flow repeatedly, not to gate a rare destructive act.
      var after = function () { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
      if (API) call('DELETE', '/api/account').then(after); else after();
    },

    'speak-answer': function () {
      if (!S.answerData || S.settings.privateMode && S.answerData.ids && S.answerData.ids.length) {
        // Private mode still speaks the summary line, never the individual tasks.
      }
      speak(S.answerData ? S.answerData.lead : '');
    },

    'submit-say': function () {
      syncFields();
      var text = (S.draft || '').trim();
      if (!text) return;
      S.heard = text;
      if (!API) {
        if (isQuestion(text)) { S.answerData = localAnswer(text); S.captureFlow = 'answer'; if (S.settings.voiceSpoken) speak(S.answerData.lead); }
        else { S.proposals = localParse(text); S.captureFlow = 'proposals'; }
        return render();
      }
      var q = isQuestion(text);
      S.thinking = true;
      S.captureFlow = q ? 'answer' : 'proposals';
      render();
      call('POST', q ? '/api/assistant/query' : '/api/assistant/parse', { text: text, today: isoOf(TODAY) })
        .then(function (res) {
          S.thinking = false;
          if (q) { S.answerData = res; if (S.settings.voiceSpoken) speak(res.lead); }
          else S.proposals = res.proposals || [];
          render();
        })
        .catch(function () {
          S.thinking = false;
          if (q) { S.answerData = localAnswer(text); if (S.settings.voiceSpoken) speak(S.answerData.lead); } else S.proposals = localParse(text);
          render();
        });
    },
    'discard-proposal': function (v) { S.proposals.splice(+v, 1); render(); },
    'proposal-set-segment': function (v, el) {
      var i = +el.getAttribute('data-i');
      S.proposals[i].segmentId = v; S.proposals[i].needsSegmentChoice = false; render();
    },
    'proposal-confirm-date': function (v, el) {
      var i = +el.getAttribute('data-i'), pr = S.proposals[i];
      if (v === 'alt' && pr.alt) pr.date = pr.alt;
      pr.dateAmbiguous = false; pr.followUp = null; render();
    },
    'accept-all-proposals': function () {
      var pending = S.proposals.filter(function (pr) { return !pr.followUp; });
      // Same rule as onboarding: a proposal the parser couldn't confidently
      // match must not be silently dumped into the first segment — it was
      // already shown "Choose a segment →" with a pillrow, so require an
      // actual tap before it becomes a real task.
      var unresolved = pending.filter(function (pr) { return !pr.segmentId; });
      if (unresolved.length) { toast('Choose a segment for "' + unresolved[0].title + '" first.'); return; }
      var create = function (pr) {
        var payload = { segment_id: pr.segmentId, title: pr.title, due_at: pr.date || null, priority: pr.priority || 'normal', reminder: pr.reminder };
        if (API) return call('POST', '/api/tasks', payload).then(function (t) { S.tasks.push(t); });
        S.tasks.push(Object.assign({ id: newId('t'), notes: '', status: 'open', calendar_event_id: null, completed_at: null, created_at: new Date().toISOString() }, payload));
        return Promise.resolve();
      };
      Promise.all(pending.map(create)).then(function () {
        S.proposals = S.proposals.filter(function (pr) { return !!pr.followUp; });
        saveLocal();
        if (S.proposals.length) { toast('Saved. One still needs an answer.'); render(); }
        else { toast('Saved ' + count(pending.length, 'task', 'tasks') + '.'); S.captureFlow = null; go(S.openSegmentId ? 'segment-detail' : (S.tabBefore || 'dashboard')); }
      });
    },

    'guide-submit': function () {
      syncFields();
      var text = (S.draft || '').trim();
      if (!text) return;
      var g = S.guide;
      g.heard = text;
      var afterParse = function (p) {
        g.title = p.title;
        g.segmentGuess = p.segmentId || null;
        g.date = p.date || null;
        g.followUp = p.followUp || null;
        g.alt = p.alt || null;
        g.step = 'confirm-segment';
        S.draft = '';
        render();
      };
      if (API) {
        call('POST', '/api/assistant/parse', { text: text, today: isoOf(TODAY) })
          .then(function (r) { afterParse((r.proposals || [])[0] || { title: text }); })
          .catch(function () { afterParse(localParseClause(text, 0)); });
      } else {
        afterParse(localParseClause(text, 0));
      }
    },
    'guide-pick-segment': function (v) { S.guide.segmentId = v; S.guide.step = 'confirm-priority'; render(); },
    'guide-pick-priority': function (v) {
      var g = S.guide;
      g.priority = v;
      if (g.followUp) { g.step = 'confirm-date'; render(); return; }
      createGuideTask();
    },
    'guide-confirm-date': function (v) {
      var g = S.guide;
      if (v === 'alt' && g.alt) g.date = g.alt;
      if (v === 'none') g.date = null;
      g.followUp = null;
      createGuideTask();
    },
    'guide-again': function () { S.guide = newGuide(); S.draft = ''; render(); }
  };

  function createGuideTask() {
    var g = S.guide;
    var seg = segmentById(g.segmentId);
    var payload = { segment_id: g.segmentId, title: g.title, due_at: g.date || null, priority: g.priority || 'normal' };
    var after = function () {
      g.createdTitle = g.title;
      g.createdSegment = seg ? seg.name : '';
      g.step = 'done';
      saveLocal();
      render();
    };
    if (API) call('POST', '/api/tasks', payload).then(function (t) { S.tasks.push(t); }).then(after);
    else { S.tasks.push(Object.assign({ id: newId('t'), notes: '', status: 'open', reminder: null, calendar_event_id: null, completed_at: null, created_at: new Date().toISOString() }, payload)); after(); }
  }

  // ---------------------------------------------------------------- voice
  var rec = null;
  function toggleMic() {
    if (S.listening) { stopMic(); return; }
    var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Rec) { toast('Voice isn’t supported in this browser — type instead.'); return; }
    if (!window.isSecureContext) { toast('Voice needs a secure connection (https) — type instead.'); return; }
    rec = new Rec();
    rec.continuous = true; rec.interimResults = true; rec.lang = 'en-GB';
    var base = S.draft || '';
    rec.onresult = function (e) {
      var t = '';
      for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      S.draft = (base ? base + ' ' : '') + t;
      render();
    };
    // A silent onerror just left the mic looking broken with no explanation —
    // surface what actually went wrong so "not-allowed" (permission blocked,
    // the common case inside an embedded/sandboxed page) reads as a fixable
    // instruction, not a dead button. "no-speech" fires routinely on a pause
    // and isn't worth a toast.
    rec.onerror = function (e) {
      var code = e && e.error;
      if (code !== 'no-speech') {
        toast(code === 'not-allowed' || code === 'service-not-allowed' ? 'Microphone access is blocked — allow it in your browser’s site settings, or type instead.'
          : code === 'audio-capture' ? 'No microphone found on this device — type instead.'
          : code === 'network' ? 'Voice needs a network connection — type instead.'
          : 'Voice ran into a problem — type instead.');
      }
      stopMic();
    };
    rec.onend = function () { S.listening = false; render(); };
    try { rec.start(); S.listening = true; render(); } catch (e) { toast('Couldn’t start the microphone.'); }
  }
  function stopMic() { if (rec) { try { rec.stop(); } catch (e) {} rec = null; } S.listening = false; render(); }

  // Text-to-speech for the "visual plus spoken response" voice preference —
  // §6.4 says never read sensitive task details in private mode, only the
  // summary line, which is all this ever passes in.
  function speak(text) {
    if (!text || !window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 1; u.pitch = 1;
      u.onstart = function () { S.speaking = true; render(); };
      u.onend = function () { S.speaking = false; render(); };
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------------------------------------------------------------- render
  function render() {
    var root = document.getElementById('root');
    var html = (SCREENS[S.screen] ? SCREENS[S.screen]() : SCREENS.dashboard()) || '';
    // A screen guard (e.g. a since-deleted segment) can call go() to redirect
    // mid-render, which re-enters render() itself — that inner call already
    // painted the right screen, so don't let this call's now-stale, empty
    // return value overwrite it.
    if (!html) return;
    root.innerHTML = html;
    var searchIn = document.getElementById('search-in');
    if (searchIn) searchIn.focus();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var v = el.getAttribute('data-v');
    if (act === 'close-sheet' && e.target !== el) return;
    syncFields();
    if (ACTS[act]) ACTS[act](v, el);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'search-in') { S.search = e.target.value; render(); }
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'set-chosen-target') {
      S.chosenSegments[+e.target.getAttribute('data-i')].target_date = e.target.value || null;
    }
    if (e.target.id === 'ns-target-in') S.newSegment.target_date = e.target.value || null;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'custom-segment-in') { e.preventDefault(); ACTS['add-custom-segment'](); }
  });

  // ---------------------------------------------------------------- boot
  function boot() {
    var web = location.protocol === 'http:' || location.protocol === 'https:';
    var probe = web
      ? fetch('/api/health', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }, function () { return null; })
      : Promise.resolve(null);
    probe.then(function (h) {
      if (h && h.trackerApp) { API = location.origin; return loadFromApi(); }
      try { absorbLocal(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) {}
      return null;
    }).then(function () {
      if (S.onboarded) { S.screen = 'dashboard'; }
      render();
    }, function () { render(); });
  }
  boot();
})();
</script>
